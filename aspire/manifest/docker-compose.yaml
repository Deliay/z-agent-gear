services:
  mongodb:
    image: "registry.cn-hangzhou.aliyuncs.com/zero-tools/mongo:7"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    expose:
      - "27017"
    volumes:
      - type: "volume"
        target: "/data/db"
        source: "agentgear.apphost-795ff385e1-mongodb-data"
        read_only: false
    networks:
      - "aspire"
  redis:
    image: "registry.cn-hangzhou.aliyuncs.com/zero-tools/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  rabbitmq:
    image: "${RABBITMQ_IMAGE:-registry.cn-hangzhou.aliyuncs.com/zero-tools/rabbitmq:3-management}"
    environment:
      RABBITMQ_DEFAULT_USER: "zag"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "5672"
      - "15672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "agentgear.apphost-795ff385e1-rabbitmq-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
  controller-api:
    image: "${CONTROLLER_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      NODE_OPTIONS: "--import tsx"
      PORT: "8001"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "8001:8001"
    networks:
      - "aspire"
    restart: "unless-stopped"
  agent-api:
    image: "${AGENT_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      NODE_OPTIONS: "--import tsx"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      JWT_SECRET: "${JWT_SECRET}"
      MCP_ENDPOINT_JWT_SECRET: "${MCP_JWT_SECRET}"
      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_URL: "${GITHUB_APP_URL}"
      GITHUB_SETUP_URL: "${GITHUB_SETUP_URL}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY}"
      GITHUB_TOKEN_ENCRYPTION_KEY: "${GITHUB_TOKEN_ENCRYPTION_KEY}"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      FRONTEND_URL: "${FRONTEND_URL}"
      ADMIN_API_URL: "http://admin-api:8002"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      # 前台云电脑（harness）：publish 默认关闭；打开前请把 CONTROLLER_API_PUBLIC_WS_ENDPOINT
      # 改为集群内可达的 controller-api 地址（worker 在 K8s 内运行）。
      HARNESS_ENABLED: "${HARNESS_ENABLED}"
      HARNESS_CONTAINER_TTL_SECONDS: "86400"
      CLOUD_CONTROLLER_URL: "http://cloud-controller:8003"
      CONTROLLER_API_PUBLIC_WS_ENDPOINT: "http://controller-api:8001"
      CLOUD_HOST_MODEL_BASE_URL: "http://admin-api:8002/v1"
      CLOUD_HOST_DEFAULT_WORKSPACE: "/home/worker/workspace"
      PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - "aspire"
    restart: "unless-stopped"
  cloud-controller:
    image: "${CLOUD_CONTROLLER_IMAGE}"
    environment:
      NODE_ENV: "production"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      K8S_NAMESPACE: "zag-cloud"
      WORKER_IMAGE: "${WORKER_IMAGE}"
      PUBLIC_WS_ENDPOINT: "${PUBLIC_WS_ENDPOINT}"
      K8S_ENABLED: "true"
      AGENT_API_URL: "http://agent-api:8000"
      AGENT_API_TIMEOUT_MS: "5000"
      ADMIN_API_URL: "http://admin-api:8002"
      JOB_EPHEMERAL_STORAGE: "10Gi"
      RABBITMQ_URL: "amqp://zag:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__rabbitmq: "amqp://zag:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      PORT: "8003"
    depends_on:
      rabbitmq:
        condition: "service_healthy"
      mongodb:
        condition: "service_started"
    ports:
      - "8003:8003"
    networks:
      - "aspire"
    restart: "unless-stopped"
  admin-api:
    image: "${ADMIN_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      CLOUD_CONTROLLER_URL: "http://cloud-controller:8003"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      AGENT_API_URL: "http://agent-api:8000"
      RABBITMQ_URL: "amqp://zag:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__rabbitmq: "amqp://zag:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      PORT: "8002"
    depends_on:
      rabbitmq:
        condition: "service_healthy"
      mongodb:
        condition: "service_started"
    ports:
      - "8002:8002"
    networks:
      - "aspire"
    restart: "unless-stopped"
  admin-web:
    image: "${ADMIN_WEB_IMAGE}"
    environment:
      ADMIN_API_URL: "${ADMIN_API_URL}"
    ports:
      - "80:80"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  agentgear.apphost-795ff385e1-mongodb-data:
    driver: "local"
  agentgear.apphost-795ff385e1-rabbitmq-data:
    driver: "local"
