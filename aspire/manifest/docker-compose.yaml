services:
  mongodb:
    image: "registry.cn-hangzhou.aliyuncs.com/zero-tools/mongo:7"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    expose:
      - "27017"
    volumes:
      - type: "volume"
        target: "/data/db"
        source: "agentgear.apphost-795ff385e1-mongodb-data"
        read_only: false
    networks:
      - "aspire"
  redis:
    image: "registry.cn-hangzhou.aliyuncs.com/zero-tools/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  otel-collector:
    image: "otel/opentelemetry-collector-contrib:latest"
    expose:
      - "4317"
      - "4318"
    volumes:
      - type: "bind"
        target: "/etc/otelcol-contrib/config.yaml"
        source: "${OTEL_COLLECTOR_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
    restart: "unless-stopped"
  rabbitmq:
    image: "registry.cn-hangzhou.aliyuncs.com/zero-tools/rabbitmq:3-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    expose:
      - "5672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "agentgear.apphost-795ff385e1-rabbitmq-data"
        read_only: false
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "-q"
        - "ping"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
  controller-api:
    image: "${CONTROLLER_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      NODE_OPTIONS: "--import tsx"
      LOG_LEVEL: "${LOG_LEVEL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE_ARG}"
      PORT: "8001"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "8001:8001"
    networks:
      - "aspire"
    restart: "unless-stopped"
  agent-api:
    image: "${AGENT_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      NODE_OPTIONS: "--import tsx"
      LOG_LEVEL: "${LOG_LEVEL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE_ARG}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      JWT_SECRET: "${JWT_SECRET}"
      MCP_ENDPOINT_JWT_SECRET: "${MCP_JWT_SECRET}"
      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_APP_URL: "${GITHUB_APP_URL}"
      GITHUB_SETUP_URL: "${GITHUB_SETUP_URL}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY}"
      GITHUB_TOKEN_ENCRYPTION_KEY: "${GITHUB_TOKEN_ENCRYPTION_KEY}"
      GITHUB_API_BASE: "${GITHUB_API_BASE}"
      EVENT_CALLBACK_TOKEN: "${EVENT_CALLBACK_TOKEN}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      CLOUD_CONTROLLER_URL: "http://cloud-controller:8003"
      CONTROLLER_API_PUBLIC_WS_ENDPOINT: "http://controller-api:8001"
      CLOUD_HOST_MODEL_BASE_URL: "http://admin-api:8002/v1"
      CLOUD_HOST_DEFAULT_WORKSPACE: "/home/worker/workspace"
      HARNESS_CONTAINER_TTL_SECONDS: "86400"
      FRONTEND_URL: "${FRONTEND_URL}"
      ADMIN_API_URL: "http://admin-api:8002"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      HARNESS_ENABLED: "${HARNESS_ENABLED}"
      PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - "aspire"
    restart: "unless-stopped"
  cloud-controller:
    image: "${CLOUD_CONTROLLER_IMAGE}"
    environment:
      NODE_ENV: "production"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      LOG_LEVEL: "${LOG_LEVEL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE_ARG}"
      K8S_NAMESPACE: "zag-cloud"
      WORKER_IMAGE: "${WORKER_IMAGE}"
      PUBLIC_WS_ENDPOINT: "${PUBLIC_WS_ENDPOINT}"
      WORKLOAD_INIT_TIMEOUT_MS: "300000"
      WORKLOAD_POST_BUDGET_MS: "90000"
      WORKLOAD_LOG_MAX_BYTES: "262144"
      JOB_EPHEMERAL_STORAGE: "10Gi"
      K8S_ENABLED: "true"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__rabbitmq: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      AGENT_API_URL: "http://agent-api:8000"
      AGENT_API_TIMEOUT_MS: "5000"
      ADMIN_API_URL: "http://admin-api:8002"
      PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      rabbitmq:
        condition: "service_healthy"
      mongodb:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
  admin-api:
    image: "${ADMIN_API_IMAGE}"
    environment:
      NODE_ENV: "production"
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET}"
      LOG_LEVEL: "${LOG_LEVEL}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_ENDPOINT}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_SAMPLE_ARG}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD}"
      CORS_ORIGIN: "${CORS_ORIGIN}"
      CLOUD_CONTROLLER_URL: "http://cloud-controller:8003"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN}"
      AGENT_API_URL: "http://agent-api:8000"
      CLOUD_CONTROLLER_DESTROY_TIMEOUT_MS: "180000"
      ConnectionStrings__mongodb: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      MONGODB_HOST: "mongodb"
      MONGODB_PORT: "27017"
      MONGODB_USERNAME: "admin"
      MONGODB_PASSWORD: "${MONGODB_PASSWORD}"
      MONGODB_AUTHENTICATIONDATABASE: "admin"
      MONGODB_AUTHENTICATIONMECHANISM: "SCRAM-SHA-256"
      MONGODB_URI: "mongodb://admin:${MONGODB_PASSWORD}@mongodb:27017/?authSource=admin&authMechanism=SCRAM-SHA-256"
      ConnectionStrings__rabbitmq: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: "service_healthy"
      mongodb:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
  admin-web:
    image: "${ADMIN_WEB_IMAGE}"
    environment:
      ADMIN_API_URL: "${ADMIN_API_URL}"
    ports:
      - "80:80"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  agentgear.apphost-795ff385e1-mongodb-data:
    driver: "local"
  agentgear.apphost-795ff385e1-rabbitmq-data:
    driver: "local"
