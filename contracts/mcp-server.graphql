enum McpServerTransport {
  registered_proxy
  http      # P2 启用
  # 平台内置 MCP 服务（如 agent-workflow-tools / agent-workflow-admin-tools），由 agent-api 直接处理，不经 MCP Proxy 转发
  platform
}

enum McpServerSource {
  proxy
  manual    # P2 启用
  # 平台内置服务，随系统自动注册。节点作用域工具集（agent-workflow-tools）随节点会话自动装配；
  # 工作流管理工具集（agent-workflow-admin-tools）可装配到任意会话
  platform
}

enum McpServerStatus {
  active
  offline
  disabled
}

type McpServerTool {
  name: String!
  description: String
}

type McpServer {
  id: ID!
  name: String!
  transport: McpServerTransport!
  source: McpServerSource!
  enabled: Boolean!
  command: String
  url: String
  hostname: String
  status: McpServerStatus!
  tools: [McpServerTool!]!
  toolsSyncedAt: String
  lastHeartbeatAt: String
  createdAt: String!
  updatedAt: String!
}

type Query {
  mcpServers: [McpServer!]!
  mcpServer(id: ID!): McpServer
}

type Mutation {
  setMcpServerEnabled(id: ID!, enabled: Boolean!): McpServer!
  # P2
  bindRemoteMcpServer(input: BindRemoteMcpServerInput!): BindRemoteMcpServerResult!
  unbindMcpServer(id: ID!): Boolean!
}

input BindRemoteMcpServerInput {
  name: String!
  url: String!
  headers: [HeaderInput!]
}

input HeaderInput {
  key: String!
  value: String!
}

type BindRemoteMcpServerResult {
  server: McpServer!
}
