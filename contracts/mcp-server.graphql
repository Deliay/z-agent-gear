enum McpServerTransport {
  registered_proxy
  http      # P2 启用
  # 平台内置 MCP 服务（如 agent-workflow-tools / agent-workflow-admin-tools），由 agent-api 直接处理，不经 MCP Proxy 转发
  platform
}

enum McpServerSource {
  proxy
  manual    # P2 启用
  # 平台内置服务，随系统自动注册。节点作用域工具集（agent-workflow-tools）随节点会话自动装配；
  # 工作流管理工具集（agent-workflow-admin-tools）可装配到任意会话。
  # agent-workflow-admin-tools 支持 MCP prompts 能力（initialize 声明 capabilities.prompts）：
  # prompts/list 返回内置提示词片段清单；prompts/get 按 name 获取片段内容（messages 形态）。
  # 内置片段：workflow-schema（工作流 Schema 说明）、workflow-project-persistence（项目持久化指引）。
  # prompts/get 未知名称或不传 name 返回 INVALID_PARAMS，message 列出可用片段名称。
  # 知识库工具集（agent-knowledge-base-tools）全部会话恒装配：`knowledge_base_create` /
  # `knowledge_base_list` / `knowledge_base_document_list` / `knowledge_base_document_get` /
  # `knowledge_base_document_update` / `knowledge_base_document_delete`；可见范围按「会话工作区 ∪
  # 本租户全局工作区」× 四档权限矩阵（与界面同口径）；`knowledge_base_create` 仅在会话创建人为
  # 租户管理员时出现在 tools/list。
  platform
}

enum McpServerStatus {
  active
  offline
  disabled
}

type McpServerTool {
  name: String!
  description: String
}

type McpServer {
  id: ID!
  name: String!
  transport: McpServerTransport!
  source: McpServerSource!
  enabled: Boolean!
  command: String
  url: String
  hostname: String
  status: McpServerStatus!
  tools: [McpServerTool!]!
  toolsSyncedAt: String
  lastHeartbeatAt: String
  createdAt: String!
  updatedAt: String!
}

type Query {
  mcpServers: [McpServer!]!
  mcpServer(id: ID!): McpServer
}

type Mutation {
  setMcpServerEnabled(id: ID!, enabled: Boolean!): McpServer!
  # P2
  bindRemoteMcpServer(input: BindRemoteMcpServerInput!): BindRemoteMcpServerResult!
  unbindMcpServer(id: ID!): Boolean!
}

input BindRemoteMcpServerInput {
  name: String!
  url: String!
  headers: [HeaderInput!]
}

input HeaderInput {
  key: String!
  value: String!
}

type BindRemoteMcpServerResult {
  server: McpServer!
}
