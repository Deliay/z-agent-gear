openapi: 3.0.3
info:
  title: Agent Gear Event Callback API
  version: 1.0.0
  description: 工作流 GitHub Pull Request 联动事件回调入口。鉴权任一通过即放行，未配置凭据时一律 401。
paths:
  /api/events/callback:
    post:
      summary: 接收 pull request 审核事件并驱动工作流
      operationId: postEventCallback
      parameters:
        - in: header
          name: X-Event-Token
          required: false
          schema: { type: string }
          description: 平台回调凭据；与 Authorization Bearer 二选一
        - in: header
          name: Authorization
          required: false
          schema: { type: string }
          description: 'Bearer <token> 形式的平台回调凭据'
        - in: header
          name: X-Hub-Signature-256
          required: false
          schema: { type: string, example: 'sha256=0123abcd' }
          description: 对原始请求字节计算的 HMAC-SHA256 签名（GitHub App Webhook 兼容）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCallbackRequest'
      responses:
        '200':
          description: 已处理或安全忽略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCallbackResponse'
        '400':
          description: 载荷非法（error=payload.invalid，detail 为字段路径）
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [payload.invalid] }
                  detail: { type: string }
        '401':
          description: 鉴权失败
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [unauthorized] }
  /api/events/github/webhook:
    post:
      summary: 接收 GitHub 原生 webhook（pull_request_review / issues）并驱动工作流
      operationId: postGithubWebhook
      description: >-
        GitHub 仓库 / App Webhook 直连入口。仅接受 X-Hub-Signature-256 验签
        （GITHUB_WEBHOOK_SECRET，未配置时一律 401）；支持 pull_request_review
        （action=submitted）与 issues（action ∈ opened/labeled/edited/reopened）两类事件。
        pull_request_review 归一化为平台事件载荷后按与 /api/events/callback
        完全一致的判定链驱动工作流；issues 事件按「仓库命中联动配置 + Issue 标签命中配置标签名」
        创建 IssueWorkflowTrigger 并异步推进（工作区初始化 → 实例化 → Issue 回评 → 首个人类节点自动完成）。
        ping、其他事件类型与不受理 action 安全忽略（200 UNSUPPORTED_EVENT）。
        pull_request_review 的 eventId 取 gh:pull_request_review:{review.id}，
        issues 的幂等由 issue_workflow_triggers 唯一索引
        (controllerId, repoFullName, labelName, issueId) 保证。
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema: { type: string, example: 'sha256=0123abcd' }
          description: 对原始请求字节计算的 HMAC-SHA256 签名（GitHub Webhook Secret）
        - in: header
          name: X-GitHub-Event
          required: true
          schema: { type: string, example: pull_request_review }
          description: >-
            GitHub 事件类型；本端点处理 pull_request_review 与 issues，
            其余（含 ping）一律忽略（200 UNSUPPORTED_EVENT）。App 侧需订阅 issues 事件。
        - in: header
          name: X-GitHub-Delivery
          required: false
          schema: { type: string }
          description: GitHub 投递 GUID，仅用于日志，不参与幂等
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GithubPullRequestReviewEvent'
                - $ref: '#/components/schemas/GithubIssuesEvent'
      responses:
        '200':
          description: 已处理或安全忽略（含 UNSUPPORTED_EVENT / HANDLER_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubWebhookResponse'
        '400':
          description: 载荷非法（error=payload.invalid，detail 为字段路径；含非 JSON Content-Type）
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [payload.invalid] }
                  detail: { type: string }
        '401':
          description: 验签失败或未配置 GITHUB_WEBHOOK_SECRET
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [unauthorized] }
components:
  schemas:
    EventCallbackRequest:
      type: object
      required: [eventType, eventId, payload]
      properties:
        eventType: { type: string, enum: [pull_request] }
        eventId: { type: string, example: 'gh:pull_request_review:987654321' }
        occurredAt: { type: string, format: date-time }
        payload:
          $ref: '#/components/schemas/EventPayload'
    EventPayload:
      type: object
      required: [pullRequestId, reviewState]
      properties:
        pullRequestId: { type: string, example: 'Deliay/z-agent-gear#264' }
        prUrl: { type: string }
        action: { type: string, example: reviewed }
        reviewState:
          type: string
          description: >-
            审核结论。已支持 approved（通过）与 changes_requested/rejected/dismissed（拒绝）；
            枚举外取值按 UNSUPPORTED_REVIEW_STATE 安全忽略（HTTP 200），不返回 400。
          example: approved
        comment: { type: string }
        reviewer: { type: string }
        submittedAt: { type: string, format: date-time }
    EventCallbackResponse:
      type: object
      required: [handled]
      properties:
        handled: { type: boolean }
        reason: { type: string, description: 所有结果均为忽略时的聚合原因 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventCallbackResult'
    EventCallbackResult:
      type: object
      properties:
        workflowInstanceId: { type: string }
        nodeId: { type: string, description: 当前人类节点；未判定当前节点时为登记的 AI 节点 }
        nodeName: { type: string }
        registeredNodeId: { type: string, description: PR 登记节点 ID（失败分支亦可定位坏登记） }
        action: { type: string, enum: [COMPLETE_HUMAN_NODE, REJECT_HUMAN_NODE] }
        promptKey: { type: string }
        reason:
          type: string
          enum:
            - NO_HANDLER
            - INSTANCE_NOT_FOUND
            - INSTANCE_DELETED
            - INSTANCE_ARCHIVED
            - INSTANCE_FINISHED
            - NODE_NOT_FOUND
            - CURRENT_NODE_NOT_HUMAN
            - CURRENT_NODE_AMBIGUOUS
            - LINK_BROKEN
            - HUMAN_NODE_IN_BETWEEN
            - DUPLICATE_EVENT
            - UNSUPPORTED_REVIEW_STATE
            - HANDLER_FAILED
    GithubPullRequestReviewEvent:
      type: object
      description: >-
        GitHub 原生 pull_request_review 事件载荷（仅列本端点消费的字段，其余字段原样忽略）。
        归一化映射：eventId=gh:pull_request_review:{review.id}；
        pullRequestId={repository.full_name}#{pull_request.number}；reviewState=review.state；
        comment=review.body；reviewer=review.user.login；submittedAt=review.submitted_at。
      required: [action, review, repository, pull_request]
      properties:
        action: { type: string, enum: [submitted], description: 其他 action 忽略（UNSUPPORTED_EVENT） }
        review:
          type: object
          required: [id, state]
          properties:
            id: { type: integer, description: 幂等位来源，跨重投稳定 }
            state:
              type: string
              description: approved / changes_requested / commented / dismissed 等，原样透传给既有判定链
              example: approved
            body: { type: [string, 'null'] }
            user:
              type: [object, 'null']
              properties:
                login: { type: string }
            submitted_at: { type: string, format: date-time }
        repository:
          type: object
          required: [full_name]
          properties:
            full_name: { type: string, example: 'Deliay/z-agent-gear' }
        pull_request:
          type: object
          required: [number]
          properties:
            number: { type: integer, example: 264 }
            html_url: { type: string }
    GithubIssuesEvent:
      type: object
      description: >-
        GitHub 原生 issues 事件载荷（仅列本端点消费的字段，其余字段原样忽略）。
        归一化映射：issueId=issue.id（幂等键）；issueNumber=issue.number；
        title=issue.title（≤256）；body=issue.body（≤64000，可空）；
        issueUrl=issue.html_url；author=issue.user.login（可空）；
        labels=issue.labels[].name；repoFullName=repository.full_name（owner/repo 两段）。
        action ∈ opened/labeled/edited/reopened，其余忽略（UNSUPPORTED_EVENT）。
      required: [action, issue, repository]
      properties:
        action: { type: string, enum: [opened, labeled, edited, reopened] }
        issue:
          type: object
          required: [id, number, title, html_url, labels]
          properties:
            id: { type: integer, description: 幂等键组成部分，跨重投稳定 }
            number: { type: integer, example: 42 }
            title: { type: string, maxLength: 256 }
            body: { type: [string, 'null'], maxLength: 64000 }
            html_url: { type: string, example: 'https://github.com/Deliay/z-agent-gear/issues/42' }
            user:
              type: [object, 'null']
              properties:
                login: { type: string }
            labels:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
        repository:
          type: object
          required: [full_name]
          properties:
            full_name: { type: string, example: 'Deliay/z-agent-gear' }
    GithubIssuesEventResult:
      type: object
      description: issues 事件逐配置处理结果（多配置命中时 results 逐项给出）
      properties:
        controllerId: { type: string }
        linkageId: { type: string }
        labelName: { type: string }
        action:
          type: [string, 'null']
          enum: [CREATE_TRIGGER, null]
        reason:
          type: string
          enum:
            - REPO_NOT_ENABLED
            - NO_MATCHING_LINKAGE
            - ALREADY_TRIGGERED
            - CLOUD_HOST_NOT_RUNNING
            - HANDLER_FAILED
    GithubWebhookResponse:
      type: object
      required: [handled, results]
      properties:
        handled: { type: boolean }
        reason:
          type: string
          description: >-
            忽略原因；除 EventCallbackResult.reason 枚举与 issues 的
            REPO_NOT_ENABLED / NO_MATCHING_LINKAGE / ALREADY_TRIGGERED /
            CLOUD_HOST_NOT_RUNNING 外，本端点另有 UNSUPPORTED_EVENT
            （ping / 非关注事件 / 非受理 action）。
            处理器异常时返回 HANDLER_FAILED（HTTP 仍为 200，避免 GitHub 重投风暴）。
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/EventCallbackResult'
              - $ref: '#/components/schemas/GithubIssuesEventResult'
