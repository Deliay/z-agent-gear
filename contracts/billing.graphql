# 前台「我的费用」契约（agent-api）
#
# 鉴权要求：所有 Query/Mutation 需要前台用户登录态（与既有 agent-api 鉴权一致）；
# 未认证返回 `UNAUTHENTICATED`。
#
# 数据归属：计费写路径全部在 admin-api；agent-api 仅经 `/internal/billing/*`
# 转发（只读查询、API Key 管理、云电脑创建一次性扣费/退款委托），不直接写计费库。
#
# 前台账户仅支持预付费（creditLimit 恒 0），不提供任何自助充值 mutation。

enum BillingOwnerType {
  front_user # 已废弃：存量前台行由迁移转为 tenant，仅作历史兼容保留读
  admin_user # 后台账户计费：保持原样，与 tenant 并存
  tenant # 前台租户计费账户（ownerId=tenantId）
}

enum BillingLedgerType {
  charge
  recharge
  adjust
}

enum BillingCategory {
  container
  model
  manual
}

enum BillingRollupGranularity {
  minute
  hour
  day
}

type BillingAccount {
  id: ID!
  ownerType: BillingOwnerType!
  ownerId: ID!
  ownerName: String!
  cashBalance: Float!
  giftBalance: Float!
  creditLimit: Float!
  frozenAmount: Float!
  availableBalance: Float! # = cash + gift + creditLimit - frozen
  status: String!
  insufficientSince: String
  ledgerCount: Int!
  createdAt: String!
  updatedAt: String!
}

type BillingInvoice {
  id: ID!
  accountId: ID!
  seq: Int!
  type: BillingLedgerType!
  category: BillingCategory!
  amount: Float!
  balanceAfter: Float! # 本次记账后的现金余额（cashBalance；不含 gift/creditLimit/frozen）
  refType: String
  refId: String
  description: String!
  items: [InvoiceItem!]!
  receiptId: ID
  createdAt: String!
}

type InvoiceItem {
  productId: String!
  quantity: Float!
  unitPrice: Float!
  amount: Float!
  meteringRef: ID
  segment: String # input | cached_input | output（中断调用带 :aborted 后缀：input:aborted=20% 未缓存、cached_input:aborted=80% 缓存、output:aborted=输出全价）
}

type BillingReceipt {
  id: ID!
  receiptNo: String!
  invoiceId: ID!
  accountId: ID!
  amount: Float!
  balanceAfter: Float!
  issuedAt: String!
}

type BillingRollup {
  bucketStart: String!
  chargeTotal: Float!
  rechargeTotal: Float!
  chargeCount: Int!
}

type BillingApiCall {
  id: ID!
  requestId: String!
  accountId: ID!
  modelId: String!
  modelName: String!
  inputTokens: Int! # 实际用量
  cachedInputTokens: Int! # 实际用量
  outputTokens: Int! # 实际用量
  cost: Float! # 按计价口径折算后的出账金额（中断调用为 20/80 拆分折后金额）
  status: String! # completed | aborted | failed
  estimated: Boolean!
  invoiceSeq: Int
  startedAt: String!
  finishedAt: String
}

type BillingApiKey {
  id: ID!
  name: String!
  keyPrefix: String!
  status: String!
  lastUsedAt: String
  createdAt: String!
}

type BillingApiKeyPayload {
  apiKey: BillingApiKey!
  secret: String! # 仅生成时返回一次
}

type Query {
  myBillingAccount: BillingAccount!
  myBillingInvoices(
    from: String
    to: String
    type: BillingLedgerType
    category: BillingCategory
    page: Int
    pageSize: Int
  ): [BillingInvoice!]!
  myBillingReceipts(page: Int, pageSize: Int): [BillingReceipt!]!
  myBillingReceipt(invoiceId: ID!): BillingReceipt
  myBillingRollups(
    granularity: BillingRollupGranularity!
    from: String!
    to: String!
  ): [BillingRollup!]!
  myBillingApiKeys: [BillingApiKey!]!
  myBillingApiCalls(status: String, page: Int, pageSize: Int): [BillingApiCall!]!
}

type Mutation {
  createMyBillingApiKey(name: String!): BillingApiKeyPayload!
  revokeMyBillingApiKey(id: ID!): BillingApiKey!
}
