# 项目工作区（ControllerWorkspace）：控制器/云电脑上的 Git 项目目录。
# 注意：与多租户二期的「租户工作区」（contracts/workspace.graphql 的 Workspace / workspaces 集合）是
# 不同概念，本契约的 workspaceId 语义与命名本期零改动。
type ControllerWorkspace {
  id: ID!
  userId: ID!
  controllerId: ID!
  name: String!
  path: String!
  isEnabled: Boolean!
  defaultBranch: String
  isGitRepo: Boolean
  createdAt: String!
  updatedAt: String!
}

type FolderEntry {
  name: String!
  path: String!
  isDirectory: Boolean!
}

type GitRepoInfo {
  isGitRepo: Boolean!
  currentBranch: String
  branches: [String!]
  defaultBranch: String
}

type WorkspaceWorktree {
  path: String!
  branch: String
  sessions: [Session!]!
  sessionCount: Int!
}

type WorktreeDeleteFailure {
  sessionId: ID!
  error: String!
}

type DeleteWorktreeResult {
  success: Boolean!
  closedSessionIds: [ID!]!
  failures: [WorktreeDeleteFailure!]!
  error: String
}

input CreateWorkspaceInput {
  controllerId: ID!
  path: String!
}

type Query {
  controllerWorkspaces(controllerId: ID!): [ControllerWorkspace!]!
  workspaces: [ControllerWorkspace!]!
  browseFolder(controllerId: ID!, path: String): [FolderEntry!]!
  getHomeDirectory(controllerId: ID!): String
  detectGitRepo(controllerId: ID!, workspaceId: ID!): GitRepoInfo!
  # 查询工作区下的 Worktree 列表（Git 仓库工作区），返回 git worktree list 与 sessions 归组的并集
  workspaceWorktrees(controllerId: ID!, workspaceId: ID!): [WorkspaceWorktree!]!
}

type Mutation {
  createWorkspace(input: CreateWorkspaceInput!): ControllerWorkspace!
  deleteWorkspace(id: ID!): Boolean!
  clearWorkspaces(controllerId: ID!): Boolean!
  toggleWorkspace(id: ID!): ControllerWorkspace!
  initGitRepo(controllerId: ID!, workspaceId: ID!): Boolean!
  setWorkspaceDefaultBranch(id: ID!, defaultBranch: String!): ControllerWorkspace!
  createFolder(controllerId: ID!, parentPath: String!, folderName: String!): FolderEntry!
  # 强制删除 Worktree：递归终止关联会话 → git worktree remove --force → fs:remove-dir 兜底
  deleteWorktree(controllerId: ID!, workspaceId: ID!, worktreePath: String!): DeleteWorktreeResult!
}
