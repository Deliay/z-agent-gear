enum SessionStatus {
  creating
  connecting
  idling
  running
  disconnected
  ended
}

enum AcpServerType {
  opencode
}

enum AcpMessageDirection {
  input
  output
}

enum AcpMessageType {
  text
  image
  tool_call
  tool_result
  plan
  error
}

type AgentMode {
  id: String!
  name: String!
  description: String
}

type AgentModelInfo {
  id: String!
  name: String!
  provider: String
}

type AgentModel {
  id: String!
  name: String!
  provider: String
}

type Session {
  id: ID!
  userId: ID!
  controllerId: ID!
  controllerName: String!
  acpServerType: AcpServerType!
  status: SessionStatus!
  title: String
  externalSessionId: String
  cwd: String
  modes: [AgentMode!]
  currentModeId: String
  currentModel: AgentModelInfo
  availableModels: [AgentModel!]
  currentModelId: String
  createdAt: String!
  updatedAt: String!
  endedAt: String
}

type AcpMessage {
  id: ID!
  sessionId: ID!
  direction: AcpMessageDirection!
  type: AcpMessageType!
  content: String!
  metadata: String
  createdAt: String!
}

type AcpCapability {
  type: AcpServerType!
  available: Boolean!
  version: String
}

type HistorySessionInfo {
  sessionId: String!
  title: String
  cwd: String!
  updatedAt: String
}

type ImportSessionResult {
  sessionId: ID!
  acpSessionId: String!
  title: String
  success: Boolean!
  error: String
  messageCount: Int
}

type CreateSessionPayload {
  session: Session!
}

input CreateSessionInput {
  controllerId: ID!
  acpServerType: AcpServerType! = opencode
  workspaceId: ID!
}

type ResumeSessionPayload {
  success: Boolean!
  status: SessionStatus!
  error: String
}

type Query {
  sessions: [Session!]!
  session(id: ID!): Session
  sessionMessages(sessionId: ID!, limit: Int, offset: Int): [AcpMessage!]!
  acpCapabilities(controllerId: ID!): [AcpCapability!]!
  listHistorySessions(controllerId: ID!, workspaceId: ID!): [HistorySessionInfo!]!
}

type Mutation {
  createSession(input: CreateSessionInput!): CreateSessionPayload!
  closeSession(id: ID!): Boolean!
  deleteSession(id: ID!): Boolean!
  sendSessionMessage(sessionId: ID!, content: String!, type: AcpMessageType = text): AcpMessage!
  cancelGeneration(sessionId: ID!): Boolean!
  resumeSession(id: ID!): ResumeSessionPayload!
  importHistorySessions(controllerId: ID!, workspaceId: ID!, sessionIds: [String!]!): [ImportSessionResult!]!
  setSessionMode(sessionId: ID!, modeId: String!): Boolean!
  setSessionModel(sessionId: ID!, modelId: String!): Boolean!
}
