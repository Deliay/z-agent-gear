scalar JSON

enum SessionStatus {
  creating
  connecting
  idling
  running
  disconnected
  ended
}

enum AcpServerType {
  opencode
  github_copilot
  claude_code
  gemini_cli
  codex
  mimo_code
  kimi_code
}

enum AcpMessageDirection {
  input
  output
}

enum AcpMessageType {
  text
  image
  tool_call
  tool_result
  plan
  error
  permission_request
}

enum PermissionOptionKind {
  allow_once
  allow_always
  reject_once
  reject_always
}

enum TodoPriority {
  immediate
  urgent
  medium
  low
}

enum TodoType {
  permission_request
  elicitation_request
}

enum PermissionTimeoutAction {
  use_global
  allow_once
  reject
  cancel
}

enum GlobalPermissionTimeoutAction {
  allow_once
  reject
  cancel
}

type AgentMode {
  id: String!
  name: String!
  description: String
}

type AgentModelInfo {
  id: String!
  name: String!
  provider: String
}

type AgentModel {
  id: String!
  name: String!
  provider: String
}

type SessionConfigOptionValue {
  value: String!
  name: String
}

type SessionConfigOption {
  id: String!
  name: String!
  description: String
  category: String
  # select | boolean
  type: String!
  # boolean 类型时序列化为 "true"/"false"
  currentValue: String
  options: [SessionConfigOptionValue!]
}

type PromptCapabilities {
  image: Boolean!
  audio: Boolean!
  embeddedContext: Boolean!
}

type AgentInfo {
  name: String!
  version: String
}

enum AuthMethodKind {
  env_var
  terminal
  agent
}

type AuthMethodInfo {
  id: String!
  kind: AuthMethodKind
  name: String
  description: String
  url: String
}

input MessageAttachmentInput {
  # image | audio | resource | resource_link
  type: String!
  data: String
  mimeType: String
  uri: String
  text: String
  name: String
  description: String
  size: Int
  title: String
}

type PermissionOption {
  optionId: String!
  name: String!
  kind: PermissionOptionKind!
}

type PermissionToolCall {
  toolCallId: String!
  title: String
  kind: String
  rawInput: JSON
  locations: JSON
}

type PermissionRequestData {
  requestId: String!
  sessionId: ID!
  toolCallId: String!
  # 完整工具调用信息（权限提醒展示用，由 ACP ToolCall 聚合提取）
  toolCall: PermissionToolCall
  options: [PermissionOption!]!
}

enum ElicitationMode {
  form
  url
}

enum ElicitationAction {
  accept
  decline
  cancel
}

type ElicitationRequestData {
  requestId: String!
  sessionId: ID!
  toolCallId: String
  mode: ElicitationMode!
  message: String!
  # form 模式：受限 JSON Schema（仅原始类型与枚举）
  requestedSchema: JSON
  # url 模式：Agent 侧 Elicitation ID 与目标 URL
  elicitationId: String
  url: String
}

type TodoItem {
  id: ID!
  type: TodoType!
  priority: TodoPriority!
  title: String!
  description: String
  isRead: Boolean!
  data: PermissionRequestData
  elicitationData: ElicitationRequestData
  createdAt: String!
}

type Session {
  id: ID!
  userId: ID!
  controllerId: ID!
  controllerName: String!
  acpServerType: AcpServerType!
  status: SessionStatus!
  title: String
  externalSessionId: String
  cwd: String
  worktreePath: String
  worktreeBranch: String
  modes: [AgentMode!]
  currentModeId: String
  currentModel: AgentModelInfo
  availableModels: [AgentModel!]
  currentModelId: String
  configOptions: [SessionConfigOption!]
  agentInfo: AgentInfo
  authRequired: Boolean!
  authMethods: [AuthMethodInfo!]
  promptCapabilities: PromptCapabilities
  supportsAdditionalDirectories: Boolean!
  permissionTimeoutAction: PermissionTimeoutAction
  createdAt: String!
  updatedAt: String!
  endedAt: String
}

type AcpMessage {
  id: ID!
  sessionId: ID!
  direction: AcpMessageDirection!
  type: AcpMessageType!
  content: JSON!
  metadata: String
  messageId: String
  createdAt: String!
}

type AcpCapability {
  type: AcpServerType!
  available: Boolean!
  version: String
  checkedAt: String
}

type HistorySessionInfo {
  sessionId: String!
  title: String
  cwd: String!
  updatedAt: String
}

type ImportSessionResult {
  sessionId: ID!
  acpSessionId: String!
  title: String
  success: Boolean!
  error: String
  messageCount: Int
}

type CreateSessionPayload {
  session: Session!
}

type DeleteHistorySessionPayload {
  success: Boolean!
  syncedToAgent: Boolean!
  error: String
}

type AuthenticateSessionPayload {
  success: Boolean!
  authRequired: Boolean
  error: String
}

input CreateSessionInput {
  controllerId: ID!
  acpServerType: AcpServerType! = opencode
  workspaceId: ID!
  enableWorktree: Boolean = false
  worktreeBranchSuffix: String
  mcpServerIds: [ID!]
  additionalDirectories: [String!]
}

type ResumeSessionPayload {
  success: Boolean!
  status: SessionStatus!
  error: String
}

type Query {
  sessions: [Session!]!
  session(id: ID!): Session
  # 返回按时间升序排列的消息列表
  # before: 可选游标，仅返回该消息之前（更早）的消息
  # limit: 可选，默认25，上限100
  # hasMore: 返回条数 == limit 则可能还有更多
  sessionMessages(sessionId: ID!, before: ID, limit: Int): [AcpMessage!]!
  acpCapabilities(controllerId: ID!): [AcpCapability!]!
  listHistorySessions(controllerId: ID!, workspaceId: ID!, acpServerType: AcpServerType = opencode): [HistorySessionInfo!]!
  getTodoList: [TodoItem!]!
  getUnreadTodoCount: Int!
}

type Mutation {
  createSession(input: CreateSessionInput!): CreateSessionPayload!
  closeSession(id: ID!): Boolean!
  deleteSession(id: ID!): Boolean!
  sendSessionMessage(sessionId: ID!, content: String!, type: AcpMessageType = text, attachments: [MessageAttachmentInput!]): AcpMessage!
  cancelGeneration(sessionId: ID!): Boolean!
  resumeSession(id: ID!, additionalDirectories: [String!]): ResumeSessionPayload!
  importHistorySessions(controllerId: ID!, workspaceId: ID!, acpServerType: AcpServerType = opencode, sessionIds: [String!]!): [ImportSessionResult!]!
  setSessionMode(sessionId: ID!, modeId: String!): Boolean!
  setSessionModel(sessionId: ID!, modelId: String!): Boolean!
  setSessionConfigOption(sessionId: ID!, configId: String!, value: String!): Boolean!
  deleteHistorySession(sessionId: ID!, syncAgent: Boolean = true): DeleteHistorySessionPayload!
  authenticateAcpSession(sessionId: ID!, methodId: String!, input: JSON): AuthenticateSessionPayload!
  logoutAcpSession(sessionId: ID!): Boolean!
  respondElicitation(requestId: String!, action: ElicitationAction!, values: JSON): Boolean!
  refreshAcpCapabilities(controllerId: ID!): [AcpCapability!]!
  respondPermission(requestId: String!, outcome: String!, optionId: String): Boolean!
  markTodoRead(todoId: ID!): Boolean!
  markAllTodoRead: Boolean!
  updatePermissionTimeout(sessionId: ID, timeoutAction: PermissionTimeoutAction!): Boolean!
  updateGlobalPermissionTimeout(timeoutAction: GlobalPermissionTimeoutAction!): Boolean!
}
