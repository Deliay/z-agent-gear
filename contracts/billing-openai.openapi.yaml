openapi: 3.0.3
info:
  title: Agent Gear 计费网关（OpenAI 兼容）
  version: 1.0.0
  description: |
    平台对外提供的独立模型调用入口，兼容 OpenAI 风格的请求/响应与错误格式。

    - 鉴权：`Authorization: Bearer zag_sk_<32 hex>`（API Key 仅生成时完整可见）。
    - Key 范围：`account`（用户设置页生成）与 `cloud_host`（云电脑运行专用，绑定 `cloudHostId` + `expiresAt`）。
      `cloud_host` Key 在过期、云电脑不存在/已软删除/状态非 `RUNNING` 时一律返回 `401 invalid_api_key`。
    - 模型范围：`cloud_host` Key 的 `/v1/models` 返回系统启用模型 ∪ 用户启用模型（含自定义模型）；
      `account` Key 仍只返回定价完整的全局模型。
    - 计费：调用前统一预扣费检查（余额不足且无授信返回 402，不产生账单）；
      调用完成后按输入 / 缓存输入 / 输出三段 token 出账并生成收据；
      中断调用按已产生用量出账（标注中断），用量缺失按兜底规则估算（标注估算）。
      系统模型（`scope=global`）走既有计费链路；`cloud_host` Key 调用用户自定义模型（`scope=user`）
      由网关代转发，**不计费**（无计量/outbox，仅写 `billable=false,cost=0` 的调用审计）。
    - 事件：调用完成后网关只写本地 outbox 即返回，异步经 RabbitMQ 进入计量管线。
servers:
  - url: http://localhost:4002
    description: admin-api（本地）
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      summary: 列出可用模型
      description: |
        - `account` Key：仅返回 `isEnabled && pricing.isBillable` 且定价完整的全局模型。
        - `cloud_host` Key：返回系统启用模型（`scope=global,isEnabled=true`）∪ 用户启用模型
          （`scope=user,isEnabled=true`，含未配置定价的自定义模型）。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/chat/completions:
    post:
      summary: 聊天补全（计费）
      description: |
        普通返回或 SSE 流式返回。流式请求自动注入 `stream_options.include_usage=true`
        以便采集用量。

        模型解析顺序：先查系统模型（`scope=global,isEnabled=true`）；未命中且 Key 为
        `cloud_host` 时查用户自定义模型（`scope=user,isEnabled=true`，按 `sortOrder,createdAt`
        取第一条）。同名时系统模型优先。自定义模型不要求定价，返回内容由网关代转发且不计费
        （`BillingApiCall.billable=false,cost=0`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: OpenAI 标准 `chat.completion` 或 SSE `chat.completion.chunk` 流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
        '400':
          description: 模型未定价 / 请求非法（`model_not_priced`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: 余额不足且无授信（`insufficient_quota`）、账户冻结（`account_frozen`）或账户缺失（`account_not_found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 模型不存在（`model_not_found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 服务端配置异常（`provider_credential_error`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 上游模型服务不可用（`upstream_error`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zag_sk_<hex>
  responses:
    Unauthorized:
      description: API Key 无效、已吊销、已过期，或 `cloud_host` Key 对应云电脑非 RUNNING/已删除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 触发限速
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Model:
      type: object
      required: [id, object, owned_by, created]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [model]
        owned_by:
          type: string
        created:
          type: integer
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        name:
          type: string
    ChatCompletionRequest:
      type: object
      description: >-
        预检额度按保守上界估算：文本按 UTF-8 字节 / 可配置倍率，图片/音频/文件/工具调用取
        「固定高估常量」与「序列化体积」的较大值；缺省 max_tokens 会被注入为上游硬上限。
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        top_p:
          type: number
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            prompt_tokens_details:
              type: object
              properties:
                cached_tokens:
                  type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              enum:
                - invalid_request_error
                - invalid_api_key
                - insufficient_quota
                - rate_limit_exceeded
                - account_frozen
                - account_not_found
                - server_error
            code:
              type: string
              enum:
                - invalid_api_key
                - insufficient_quota
                - model_not_found
                - model_not_priced
                - rate_limit_exceeded
                - invalid_request
                - account_frozen
                - account_not_found
                - provider_credential_error
                - upstream_error
