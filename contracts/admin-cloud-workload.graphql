# 工作负载契约（云控制器工作负载功能）
#
# 鉴权要求：所有 Query/Mutation 需要 `Authorization: Bearer <admin JWT>`；
# 未认证返回 `UNAUTHENTICATED`（错误信息 `Not authenticated`）。
#
# 数据归属：
# - `cloudworkloads`：工作负载定义，由 admin-api 直写（CRUD），cloud-controller 只读。
# - `cloudworkloadlogs`：执行记录，由 cloud-controller 写入（单一事实源），admin-api 只读。
#   `adminCloudContainerWorkloadLogs` 优先经 cloud-controller 内部 API 查询，
#   控制面不可达时降级直读 Mongo 只读模型（与容器列表降级模式一致）。
#
# 校验规则（服务端强制，契约级）：
# - `name` 必填，trim 后 1~64 字符且 `cloudworkloads` 内唯一；
# - `initScript` / `postScript` 各自 ≤ 16 KiB（16384 字节，UTF-8），且至少其一非空（trim 后）；
# - 单次启动挂载 `workloadIds` ≤ 10 个，去重且保持选择顺序，必须全部存在；
# - `paramSchema`：参数数量 ≤ 20；`key` 满足 `^[a-z][a-z0-9_]{0,31}$` 且工作负载内唯一；
#   `label` 1~64 字符；`options` 仅 SELECT/MULTI_SELECT 使用（1~50 项、去重、非空、单项 ≤100 字符），
#   其他类型归一为 `[]`；`defaultValue` 必填且按类型校验
#   （SELECT 必须属于 options；MULTI_SELECT 为 options 子集且去重，可空数组；
#   TEXT 为 ≤1024 字符字符串；BOOLEAN 为布尔值）；
# - `dependsOnWorkloadIds`：≤ 5 个、存在、非自身、数组内去重、禁止依赖环。
#
# 错误文案：
# - 名称重复 → `Workload name already exists`
# - 校验失败 → 明确字段错误信息（如 `name is required` / `at least one script is required`）
# - 参数/依赖校验失败 → 字段路径（如 `paramSchema[1].defaultValue is invalid`）、
#   `too many dependencies` / `workload cannot depend on itself` / `dependency cycle detected`

# 参数值、默认值使用的 JSON 标量：
# 支持字符串（TEXT/SELECT）、字符串数组（MULTI_SELECT）与布尔值（BOOLEAN）。
# JSON scalar 会绕过 GraphQL 静态类型，服务端必须做运行时类型与取值校验。
scalar JSON

# 参数字段类型
enum CloudWorkloadParamType {
  SELECT # 下拉单选
  MULTI_SELECT # 下拉多选
  TEXT # 文本
  BOOLEAN # 布尔
}

# 工作负载分类：standard = 运行环境/工具，harness = 云电脑 harness
enum CloudWorkloadKind {
  STANDARD
  HARNESS
}

# 单个参数定义
type CloudWorkloadParamField {
  key: String! # 参数标识，工作负载内唯一，用于脚本中引用（WORKLOAD_PARAM_<KEY_UPPER>）
  label: String! # 展示名称
  type: CloudWorkloadParamType!
  options: [String!]! # SELECT/MULTI_SELECT 的可选项；其他类型为 []
  defaultValue: JSON! # 必填：string | string[] | boolean
}

input CloudWorkloadParamFieldInput {
  key: String!
  label: String!
  type: CloudWorkloadParamType!
  options: [String!]
  defaultValue: JSON!
}

type CloudWorkload {
  id: ID!
  name: String!
  initScript: String
  postScript: String
  paramSchema: [CloudWorkloadParamField!]! # 空数组表示无参数配置
  dependsOnWorkloadIds: [ID!]! # 依赖的工作负载，按配置顺序初始化；一期最多 5 个
  isPreset: Boolean! # 是否为预制工作负载（仅展示用）
  workloadKind: CloudWorkloadKind! # 历史数据缺省 STANDARD
  harnessType: String # harness 负载类型（如 opencode）；standard 为 null
  createdAt: String!
  updatedAt: String!
}

input CreateCloudWorkloadInput {
  name: String!
  initScript: String
  postScript: String
  paramSchema: [CloudWorkloadParamFieldInput!]
  dependsOnWorkloadIds: [ID!]
}

input UpdateCloudWorkloadInput {
  name: String
  initScript: String
  postScript: String
  paramSchema: [CloudWorkloadParamFieldInput!]
  dependsOnWorkloadIds: [ID!]
}

# 启动容器时对单个工作负载的选择与参数值
input CloudWorkloadSelectionInput {
  workloadId: ID!
  params: JSON # 缺省/缺字段 = 使用该字段默认值
  # 本次启动是否将该项视为「必须」：
  # - 缺省 false；仅 `=== true` 生效（非布尔按缺省 false 处理）；
  # - 仅对含初始化脚本（`initScript` trim 后非空）的工作负载产生硬失败语义；
  # - 其初始化失败/超时/执行前被删除时将中断初始化并强制注销容器（不重试、不退避）；
  # - 隐式依赖（由 `dependsOnWorkloadIds` 展开）永远按 false 处理。
  required: Boolean
}

enum CloudWorkloadLogPhase {
  INIT
  POST
}

enum CloudWorkloadLogStatus {
  PENDING
  RUNNING
  SUCCESS
  FAILED
  TIMEOUT
}

enum CloudWorkloadLogTrigger {
  START
  RUNTIME
}

enum CloudWorkloadLogSource {
  ADMIN
  USER
  MCP
  SYSTEM
}

# 单条工作负载脚本执行记录（含当时实际执行脚本的内容快照）
type CloudWorkloadLog {
  id: ID!
  containerId: ID!
  workloadId: ID!
  workloadName: String! # 名称快照：工作负载被编辑/删除后记录仍可读
  phase: CloudWorkloadLogPhase!
  status: CloudWorkloadLogStatus!
  script: String! # 当时实际执行的脚本内容快照（留档）
  params: JSON! # 本次执行实际使用的参数值快照（已归一，含默认值）；历史记录缺省为 {}
  # 本次启动该项是否为「必须」（快照）；历史记录缺省 false（按非必须展示）
  required: Boolean!
  # 触发来源：START=容器启动初始化（历史记录缺省）；RUNTIME=在线容器 runtime 安装/系统脚本
  trigger: CloudWorkloadLogTrigger
  # 调用来源：ADMIN/USER/MCP/SYSTEM（历史记录缺省 ADMIN）
  source: CloudWorkloadLogSource
  exitCode: Int
  log: String!
  startedAt: String
  finishedAt: String
}

type Query {
  # 全部工作负载（按创建时间倒序，最新在前）
  adminCloudWorkloads: [CloudWorkload!]!
  # 指定容器的工作负载执行记录（按创建顺序升序 = 执行顺序；控制面不可达时降级直读 Mongo）
  adminCloudContainerWorkloadLogs(containerId: ID!): [CloudWorkloadLog!]!
}

type Mutation {
  adminCreateCloudWorkload(input: CreateCloudWorkloadInput!): CloudWorkload!
  adminUpdateCloudWorkload(id: ID!, input: UpdateCloudWorkloadInput!): CloudWorkload!
  # 删除工作负载；已产生的执行记录（含脚本/名称快照）不受影响，仅影响后续启动选择
  adminDeleteCloudWorkload(id: ID!): Boolean!
}
