type GitHubRepoPermissions {
  read: Boolean!
  write: Boolean!
}

type GitHubRepo {
  id: ID!
  repoId: Int!
  repoName: String!
  fullName: String!
  private: Boolean!
  permissions: GitHubRepoPermissions!
}

type GitHubInstallation {
  id: ID!
  installationId: Int!
  managementUrl: String!
  repos: [GitHubRepo!]
  createdAt: String!
}

type GitHubAccount {
  id: ID!
  githubUserId: Int!
  githubLogin: String!
  githubAvatarUrl: String
  installations: [GitHubInstallation!]
  # 所属租户工作区 id（多租户二期）：绑定归属创建时工作区。
  # 读口径 = 当前工作区 ∪ 本租户全局工作区；绑定/解绑写操作仅作用于当前工作区且受只读拦截。
  workspaceId: ID!
  createdAt: String!
}

type GitHubAppUrl {
  url: String!
  state: String!
}

# ---------------------------------------------------------------------------
# Commit 设置（仅对云容器环境生效；本地控制器不受影响）
#
# 从未保存返回 committerMode=UNSET + committerType=UNSET 的默认值。
# 服务端权威校验失败时返回以下白名单错误文案（前端原样映射，不改写）：
#   - committer is required for the selected mode
#   - invalid github account
#   - invalid custom committer
# 归一规则按 committerType 清理冗余字段（committerMode=UNSET 不清空提交人）：
#   - UNSET            → githubAccountId / customName / customEmail 置空
#   - GITHUB_ACCOUNT   → customName / customEmail 置空
#   - CUSTOM           → githubAccountId 置空
# ---------------------------------------------------------------------------

enum CommitterMode {
  AGENT_ONLY
  CO_AUTHOR
  HUMAN_ONLY
  UNSET
}

enum CommitterType {
  GITHUB_ACCOUNT
  CUSTOM
  UNSET
}

type CommitSettings {
  committerMode: CommitterMode!
  committerType: CommitterType!
  # committerType = GITHUB_ACCOUNT 时为所选已绑定非 org 帐号 id，其余为 null
  githubAccountId: ID
  # committerType = CUSTOM 时为自定义用户名/邮箱（对应 git user/email），其余为 null
  customName: String
  customEmail: String
  # 生效值来源（多租户二期新增）：本工作区已设置 / 继承自全局工作区 / 两级均未设置
  source: CommitSettingsSource!
  # 当前上下文是否只读（全局工作区且 developer 角色）
  readOnly: Boolean!
}

enum CommitSettingsSource {
  WORKSPACE # 本工作区已设置
  GLOBAL # 继承自全局工作区
  UNSET # 两级均未设置（行为与升级前一致）
}

input CommitSettingsInput {
  committerMode: CommitterMode!
  committerType: CommitterType!
  githubAccountId: ID
  customName: String
  customEmail: String
}

extend type Query {
  githubAccounts: [GitHubAccount!]!
  githubAppUrl: GitHubAppUrl!
  """当前工作区的生效 Commit 设置（仅对云容器环境生效）；继承链 本工作区 → 全局工作区 → 未设置，source 透出来源"""
  commitSettings: CommitSettings!
}

extend type Mutation {
  unbindGitHubAccount(accountId: ID!): Boolean!
  refreshGitHubInstallations(accountId: ID!): GitHubAccount!
  """保存 Commit 设置；非法组合返回白名单错误文案"""
  updateCommitSettings(input: CommitSettingsInput!): CommitSettings!
}
