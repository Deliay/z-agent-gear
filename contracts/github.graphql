type GitHubRepoPermissions {
  read: Boolean!
  write: Boolean!
}

type GitHubRepo {
  id: ID!
  repoId: Int!
  repoName: String!
  fullName: String!
  private: Boolean!
  permissions: GitHubRepoPermissions!
}

type GitHubInstallation {
  id: ID!
  installationId: Int!
  managementUrl: String!
  repos: [GitHubRepo!]
  createdAt: String!
}

type GitHubAccount {
  id: ID!
  githubUserId: Int!
  githubLogin: String!
  githubAvatarUrl: String
  installations: [GitHubInstallation!]
  # 所属租户工作区 id（多租户二期）：绑定归属创建时工作区。
  # 读口径 = 当前工作区 ∪ 本租户全局工作区；绑定/解绑写操作仅作用于当前工作区且受只读拦截。
  workspaceId: ID!
  createdAt: String!
}

type GitHubAppUrl {
  url: String!
  state: String!
}

# ---------------------------------------------------------------------------
# Commit 设置（成员级提交人设置；仅对云容器环境生效，本地控制器不受影响）
#
# 成员独立、无共享/继承：每个成员一份设置，任何工作区下均为同一份。
# 从未保存返回 committerType=UNSET 的默认值。
# 服务端权威校验失败时返回以下白名单错误文案（前端原样映射，不改写）：
#   - invalid custom committer
# 归一规则：UNSET 清空 customName / customEmail；CUSTOM 必须提供合法用户名与邮箱。
#
# 下发口径（与工作区设置无关）：
#   - 云电脑自身（非 Worktree）= 平台 bot（无视本设置）
#   - 勾选 Worktree 的会话/工作流 = 创建者的本设置
#   - Issue 拉起的工作流 = 触发人的本设置（未设置回退其 GitHub 身份，再回退 bot）
# ---------------------------------------------------------------------------

enum CommitterType {
  CUSTOM
  UNSET
}

"""成员级提交人设置"""
type CommitSettings {
  committerType: CommitterType!
  # committerType = CUSTOM 时为自定义用户名/邮箱（对应 git user/email），其余为 null
  customName: String
  customEmail: String
}

input CommitSettingsInput {
  committerType: CommitterType!
  customName: String
  customEmail: String
}

extend type Query {
  githubAccounts: [GitHubAccount!]!
  githubAppUrl: GitHubAppUrl!
  """当前成员的提交人设置（仅对云容器环境生效）；从未保存返回 UNSET 默认值"""
  commitSettings: CommitSettings!
  """当前账户对应的个人租户绑定的全部 GitHub 帐号（「导入Github帐号信息」弹窗数据源）"""
  personalGithubAccounts: [GitHubAccount!]!
}

extend type Mutation {
  unbindGitHubAccount(accountId: ID!): Boolean!
  refreshGitHubInstallations(accountId: ID!): GitHubAccount!
  """保存当前成员的提交人设置；非法输入返回白名单错误文案"""
  updateCommitSettings(input: CommitSettingsInput!): CommitSettings!
}
