enum ProviderType {
  OpenAI
  Anthropic
}

enum CredentialType {
  api_key
}

# 配置归属：user 为用户侧配置，global 为管理后台全局配置。
# global 且 isEnabled 的模型对所有用户可用。
#
# 多租户二期工作区口径（契约 3）：
# - `scope=user` 行读口径 = 当前工作区 ∪ 本租户全局工作区（普通工作区可共享全局资源，来源徽标区分）；
# - 写口径（增删改/排序/启停/batch*）= 仅当前工作区自身行；全局工作区上下文要求 admin，
#   developer 被 `global workspace is read-only` 拦截；
# - 同租户内 `scope=user` 行唯一性按 `(workspaceId, name)` 判定；不同工作区（含全局）允许同名并存。
enum ConfigScope {
  user
  global
}

# Model.provider 摘要：不含 endpoint / 凭据等敏感字段，用户侧可见。
type ProviderSummary {
  id: ID!
  name: String!
  type: ProviderType!
  isEnabled: Boolean!
  scope: ConfigScope!
}

type Provider {
  id: ID!
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType!
  credentialValue: String!
  isEnabled: Boolean!
  scope: ConfigScope!
  # 所属租户工作区 id（多租户二期）：scope=user 行为所属工作区；scope=global 平台内置行恒为 null
  workspaceId: ID
  models: [Model!]!
  createdAt: String!
  updatedAt: String!
}

type Model {
  id: ID!
  # 后台（scope=global）模型掩蔽来源 providerId（返回 null），避免按 id 反查后台供应商；
  # user 模型仍返回自身 providerId。悬空 providerId 亦可能为 null。
  providerId: ID
  # provider 可为空：global 模型（系统内置）不暴露后台供应商摘要，固定返回 null；
  # user 模型在 providerId 悬空（关联供应商已不存在）时返回 null，
  # 避免非空违规导致整条 models 查询失败。
  provider: ProviderSummary
  name: String!
  isCustom: Boolean!
  isEnabled: Boolean!
  sortOrder: Int!
  scope: ConfigScope!
  # 所属租户工作区 id（多租户二期）：scope=user 行为所属工作区；scope=global 平台内置行恒为 null。
  # 读口径 = 当前工作区 ∪ 本租户全局工作区；写口径 = 仅当前工作区自身行（全局上下文要求 admin）。
  workspaceId: ID  # 模型定价（只读展示）；与 admin-llm.graphql 的 ModelPricing 逐字一致。
  pricing: ModelPricing
  # 最长上下文大小（token）；null = 未设置。用户自有（scope=user）模型可经
  # updateModelContextLength 编辑；global 模型只读（后台管理）。与 admin-llm.graphql 同步演进。
  contextLength: Int
  createdAt: String!
  updatedAt: String!
}

# credits / 百万 token（边界以 credits 展示，持久层为整数分）
type ModelPricing {
  inputPerMillion: Float!
  cachedInputPerMillion: Float!
  outputPerMillion: Float!
  isBillable: Boolean!
}

input ProviderInput {
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType! = api_key
  credentialValue: String!
}

input CustomModelInput {
  providerId: ID!
  name: String!
  # 新增：最长上下文大小（token，正整数）；缺省/传 null = 未设置。
  # 缺省时服务端会尽力从供应商上游元数据自动补全（取不到则保持未设置）。
  contextLength: Int
}

# 供应商上游模型清单条目（用于新增自定义模型时预填上下文长度）。
type ProviderModelOption {
  name: String!
  # 上游尽力提供的上下文长度（token）；取不到为 null。
  contextLength: Int
}

type ProviderBatchPayload {
  successCount: Int!
}

type Query {
  providers: [Provider!]!
  models: [Model!]!
  modelsByProvider(providerId: ID!): [Model!]!
  # 拉取用户自有供应商的上游模型清单（含尽力获取的上下文长度）；不在服务端缓存。
  providerModelOptions(providerId: ID!): [ProviderModelOption!]!
}

type Mutation {
  createProvider(input: ProviderInput!): Provider!
  updateProvider(id: ID!, input: ProviderInput!): Provider!
  deleteProvider(id: ID!): Boolean!
  toggleProvider(id: ID!): Provider!

  batchEnableProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDisableProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDeleteProviders(ids: [ID!]!): ProviderBatchPayload!

  createCustomModel(input: CustomModelInput!): Model!
  deleteCustomModel(id: ID!): Model!
  toggleModel(id: ID!): Model!
  updateModelSortOrder(ids: [ID!]!): [Model!]!
  # 编辑用户自有模型的上下文长度（正整数；null = 清空）。
  # global 模型 / 他人工作区 / 不存在统一返回 Model not found。
  updateModelContextLength(modelId: ID!, contextLength: Int): Model!
}

# 运行期下发注记：上述用户侧模型/供应商 mutation 成功后，服务端会以 best-effort
# fire-and-forget 方式把最新模型清单实时下发到该租户运行中的云电脑（失败只告警，
# 不影响 mutation 返回）；部分 Harness 运行时不会重载模型配置，前端需在保存成功时提醒用户。
# 模型启停对 OpenAI 兼容网关逐请求生效：禁用后新请求立即返回模型不可用，进行中的请求不受影响。
