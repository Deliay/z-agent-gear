enum ProviderType {
  OpenAI
  Anthropic
}

enum CredentialType {
  api_key
}

# 配置归属：user 为用户侧配置，global 为管理后台全局配置。
# global 且 isEnabled 的模型对所有用户可用。
enum ConfigScope {
  user
  global
}

# Model.provider 摘要：不含 endpoint / 凭据等敏感字段，用户侧可见。
type ProviderSummary {
  id: ID!
  name: String!
  type: ProviderType!
  isEnabled: Boolean!
  scope: ConfigScope!
}

type Provider {
  id: ID!
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType!
  credentialValue: String!
  isEnabled: Boolean!
  scope: ConfigScope!
  models: [Model!]!
  createdAt: String!
  updatedAt: String!
}

type Model {
  id: ID!
  # 后台（scope=global）模型掩蔽来源 providerId（返回 null），避免按 id 反查后台供应商；
  # user 模型仍返回自身 providerId。悬空 providerId 亦可能为 null。
  providerId: ID
  # provider 可为空：global 模型（系统内置）不暴露后台供应商摘要，固定返回 null；
  # user 模型在 providerId 悬空（关联供应商已不存在）时返回 null，
  # 避免非空违规导致整条 models 查询失败。
  provider: ProviderSummary
  name: String!
  isCustom: Boolean!
  isEnabled: Boolean!
  sortOrder: Int!
  scope: ConfigScope!
  # 模型定价（只读展示）；与 admin-llm.graphql 的 ModelPricing 逐字一致。
  pricing: ModelPricing
  # 最长上下文大小（token）；null = 未设置（只读，与 admin-llm.graphql 同步演进）
  contextLength: Int
  createdAt: String!
  updatedAt: String!
}

# credits / 百万 token（边界以 credits 展示，持久层为整数分）
type ModelPricing {
  inputPerMillion: Float!
  cachedInputPerMillion: Float!
  outputPerMillion: Float!
  isBillable: Boolean!
}

input ProviderInput {
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType! = api_key
  credentialValue: String!
}

input CustomModelInput {
  providerId: ID!
  name: String!
}

type ProviderBatchPayload {
  successCount: Int!
}

type Query {
  providers: [Provider!]!
  models: [Model!]!
  modelsByProvider(providerId: ID!): [Model!]!
}

type Mutation {
  createProvider(input: ProviderInput!): Provider!
  updateProvider(id: ID!, input: ProviderInput!): Provider!
  deleteProvider(id: ID!): Boolean!
  toggleProvider(id: ID!): Provider!

  batchEnableProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDisableProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDeleteProviders(ids: [ID!]!): ProviderBatchPayload!

  createCustomModel(input: CustomModelInput!): Model!
  deleteCustomModel(id: ID!): Model!
  toggleModel(id: ID!): Model!
  updateModelSortOrder(ids: [ID!]!): [Model!]!
}
