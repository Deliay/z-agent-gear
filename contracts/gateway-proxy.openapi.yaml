openapi: 3.1.0
info:
  title: Gateway Proxy API
  description: |
    统一网关代理接口，将外部请求代理到 agent-controller 所在机器的本地服务。需要身份验证。

    认证方式（按优先级）：
    1. `Authorization: Bearer <JWT>` header — API 客户端（curl/fetch）
    2. `Cookie: token=<JWT>` — 浏览器直接访问
  version: 1.0.0

servers:
  - url: /api
    description: agent-api

paths:
  /mcp/{sessionId}:
    post:
      operationId: forwardMcpRequest
      summary: MCP 统一入口（会话级）
      description: |
        集成式 MCP Registry 的统一调用入口，将 MCP JSON-RPC 请求路由到持有目标代理连接的 controller-api 副本。

        请求链路：agent-controller → 统一网关 → agent-api(校验 JWT + endpoint 状态) → Redis Pub/Sub → controller-api(持有者) → Socket.IO → mcp-proxy

        要求：
        - 需要 Bearer JWT（MCP_ENDPOINT_JWT_SECRET 签发，payload 含 sessionId/userId/serverNames）
        - URL sessionId 须与 JWT payload 中的 sessionId 一致
        - 对应会话的 endpoint 状态必须为 active
        - 目标 server 通过 URL 后缀 `/mcp/{sessionId}/{serverName}` 指定（每 server 独立 URL）；不带后缀时回落到 `params.serverName`（兼容），再回落到 JWT `serverNames[0]`
      tags:
        - MCP
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON-RPC 响应
        '202':
          description: |
            JSON-RPC notification（无 id，如 `notifications/initialized`）已被接受。
            notification 按 MCP 规范转发但不等待响应（fire-and-forget），避免
            整条转发链路空等超时。
        '401':
          description: 未认证或 endpoint 已吊销（ENDPOINT_REVOKED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 代理失败（SERVER_OFFLINE / FORWARD_TIMEOUT / FORWARD_ERROR）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: mcpStandaloneStream
      summary: MCP standalone SSE stream（不支持）
      description: |
        MCP Streamable HTTP 允许客户端通过 GET 打开独立 SSE 流。本端点不提供该能力，
        按规范返回 405；客户端应继续通过 POST 完成请求-响应。
      tags:
        - MCP
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '405':
          description: SSE stream not supported（METHOD_NOT_ALLOWED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /mcp/{sessionId}/{serverName}:
    post:
      operationId: forwardMcpRequestToServer
      summary: MCP 统一入口（会话级 + server 级）
      description: |
        与 `/mcp/{sessionId}` 相同，但目标 MCP Server 由路径中的 `serverName` 指定。

        agent-controller 为会话装配的每个 MCP Server 生成独立的 ACP HTTP MCP 端点（`{url}/{serverName}`），标准 MCP 客户端无需携带任何自定义参数即可正确路由。`serverName` 必须包含在 JWT `serverNames` 中（即创建会话时已勾选装配）。
      tags:
        - MCP
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
        - name: serverName
          in: path
          required: true
          description: 目标 MCP Server 名称（须为会话已装配的 server）
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON-RPC 响应（server 未装配 / 不存在 / 离线时返回 JSON-RPC error：SERVER_NOT_FOUND / SERVER_OFFLINE / FORWARD_TIMEOUT / FORWARD_ERROR）
        '202':
          description: JSON-RPC notification（无 id）已接受并转发（fire-and-forget）
        '401':
          description: 未认证或 endpoint 已吊销（ENDPOINT_REVOKED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: mcpStandaloneStreamToServer
      summary: MCP standalone SSE stream（不支持，返回 405）
      description: 与 `/mcp/{sessionId}` 的 GET 相同，本端点不提供独立 SSE 流，按规范返回 405。
      tags:
        - MCP
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
        - name: serverName
          in: path
          required: true
          description: 目标 MCP Server 名称
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '405':
          description: SSE stream not supported（METHOD_NOT_ALLOWED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gateway/{controllerId}/{name}/{path}:
    get:
      operationId: proxyGateway
      summary: 代理请求到本地服务
      description: |
        按服务名称查找本地服务端口，将外部 HTTP 请求代理到 agent-controller 所在机器上的本地服务。

        请求链路：外部用户 → agent-api(按名称查端口) → Redis Pub/Sub → controller-api → Socket.IO → agent-controller → localhost:{port}

        要求：
        - 需要身份验证（支持 Authorization header 或 token cookie）
        - 对应的网关记录必须存在且状态为 active
      tags:
        - Gateway Proxy
      parameters:
        - name: controllerId
          in: path
          required: true
          description: Controller ID
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: 服务名称
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: 代理路径（本地服务的子路径）
          schema:
            type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: 本地服务的响应（透传状态码、Headers、Body）
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 网关不存在或未激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 代理失败（本地服务不可达或响应异常）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT token cookie，由前端登录后自动写入

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
