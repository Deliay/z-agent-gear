# 管理员认证契约（云控制器管理后台一期）
#
# 鉴权要求：
# - `adminMe` 未认证时返回 `null`（不报错）。
# - 其余 Query/Mutation 需要 `Authorization: Bearer <admin JWT>`；未认证返回
#   `UNAUTHENTICATED`（错误信息 `Not authenticated`）。
# - 已认证但 `mustChangePassword=true` 时，业务 Query/Mutation 返回
#   `MUST_CHANGE_PASSWORD`（错误信息 `MUST_CHANGE_PASSWORD`）；
#   白名单（不校验 mustChangePassword）：`adminMe`、`adminLogin`、`changeAdminPassword`。
# - `changeAdminPassword` 成功后，此前签发的所有旧 token 立即失效（校验 `passwordChangedAt`），
#   仅本次返回的新 token 有效。
# 本契约不提供任何注册 mutation（仅内置 admin 种子帐号）。

type AdminUser {
  id: ID!
  username: String!
  mustChangePassword: Boolean!
  createdAt: String!
  updatedAt: String!
}

type AdminAuthPayload {
  token: String!
  admin: AdminUser!
}

# ===== 后台第三方登录（自定义 OIDC / GitHub OAuth）=====
#
# - 后台外部身份**必须先绑定**（本人在「账号安全」完成绑定）才可登录，
#   杜绝 IdP 任意用户自动获得管理员权限；
# - 配置唯一写方在 admin-api（contracts/admin-auth-provider.graphql）；
# - 枚举 AuthProviderType 与 contracts/auth.graphql 值域逐字一致（oidc / github_oauth）。

enum AuthProviderType {
  oidc
  github_oauth
}

type AdminAuthProviderInfo {
  id: ID!
  type: AuthProviderType!
  displayName: String!
}

type AdminExternalLogin {
  id: ID!
  providerId: ID!
  providerDisplayName: String!
  externalUsername: String! # 外部帐号名（github login / preferred_username）
  createdAt: String!
}

type Query {
  adminMe: AdminUser
  # 免登录（登录页前置查询）；仅返回 enabled 且 enableAdminLogin=true 的配置
  adminAuthProviders: [AdminAuthProviderInfo!]!
  # 需管理员登录；当前管理员已绑定的外部身份
  adminExternalLogins: [AdminExternalLogin!]!
}

type Mutation {
  # 登录；不存在注册 mutation
  adminLogin(username: String!, password: String!): AdminAuthPayload!
  # 修改密码（需已登录）；成功后 mustChangePassword=false 并签发新 token
  changeAdminPassword(oldPassword: String!, newPassword: String!): AdminAuthPayload!
  # 一次性登录票据兑换（免登录，同前台口径：GETDEL、60s TTL）
  adminExchangeLoginTicket(ticket: String!): AdminAuthPayload!
  # 需管理员登录；为当前管理员创建绑定票据（10 分钟有效），前端携票据跳转 agent-api 发起绑定
  createAdminBindTicket(providerId: ID!): String!
  # 需管理员登录；解除本人一条绑定
  unbindAdminExternalLogin(id: ID!): Boolean!
}
