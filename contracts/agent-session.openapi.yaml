openapi: 3.1.0
info:
  title: Agent Session SSE API
  description: Agent Session SSE 实时消息流接口
  version: 1.0.0

servers:
  - url: /api
    description: agent-api

paths:
  /session/{id}/stream:
    get:
      operationId: streamSession
      summary: Session SSE 实时消息流
      description: |
        建立 Server-Sent Events 连接，实时接收 Session 的 ACP 消息。

        连接建立后：
        1. 立即返回最近最多 25 条历史消息（`history` 事件）
        2. 后续有新消息时实时推送（`message` 事件）
        3. 每 30s 发送心跳保活（`heartbeat` 事件）
        4. Session 状态变更时推送（`status` 事件）
      tags:
        - Session SSE
      parameters:
        - name: id
          in: path
          required: true
          description: Session ID
          schema:
            type: string
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                history:
                  summary: 历史消息（连接时一次性返回）
                  value: |
                    data: {"type":"history","data":[{"id":"msg_1","sessionId":"sess_1","direction":"output","type":"text","content":"Hello!","createdAt":"2026-05-18T10:00:00Z"}]}

                message:
                  summary: 新消息（实时推送）
                  value: |
                    data: {"type":"message","data":{"id":"msg_2","sessionId":"sess_1","direction":"output","type":"text","content":"How can I help?","createdAt":"2026-05-18T10:00:01Z"}}

                status:
                  summary: 状态变更
                  value: |
                    data: {"type":"status","data":{"sessionId":"sess_1","status":"idling"}}

                status_error:
                  summary: 恢复失败
                  value: |
                    data: {"type":"status","data":{"sessionId":"sess_1","status":"ended","error":"CONTROLLER_OFFLINE"}}

                config_changed:
                  summary: 会话配置项变更
                  value: |
                    data: {"type":"config:changed","data":{"sessionId":"sess_1","configOptions":[{"id":"model","name":"Model","type":"select","currentValue":"claude-4","options":[{"value":"claude-4","name":"Claude 4"}]}]}}

                auth_required:
                  summary: Agent 要求认证
                  value: |
                    data: {"type":"auth:required","data":{"sessionId":"sess_1","authMethods":[{"id":"env","kind":"env_var","description":"Sign in with GitHub"}]}}

                heartbeat:
                  summary: 心跳（每30s）
                  value: |
                    data: {"type":"heartbeat"}
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 无权限访问该 Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/stream:
    get:
      operationId: streamUserEvents
      summary: 用户级 SSE 事件流
      description: |
        建立用户级 Server-Sent Events 连接，实时接收与具体 Session 无关的用户事件
        （如 Kimi Code harness 登录引导）。前端在 `MainLayout` 全局订阅，用于即时呈现登录弹窗；
        `HOME_OVERVIEW` 待办轮询保留为断线兜底。

        连接建立后：
        1. 立即推送 `ready` 事件
        2. 每 30s 发送心跳保活（`heartbeat` 事件）
        3. 服务端事件到达时推送对应事件
      tags:
        - User SSE
      parameters:
        - name: token
          in: query
          required: true
          description: 前台用户 JWT（EventSource 无法自定义请求头，故用查询参数）
          schema:
            type: string
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                ready:
                  summary: 连接就绪
                  value: |
                    data: {"type":"ready"}
                harness_login_required:
                  summary: Kimi Code 需要登录
                  value: |
                    data: {"type":"harness_login_required","data":{"requestId":"hl_1","controllerId":"ctrl_1","serverType":"kimi_code","trigger":"probe-options","url":"https://www.kimi.com/code/authorize_device?user_code=4CQ4-0XIG","userCode":"4CQ4-0XIG","expiresAt":"2026-10-25T12:00:00.000Z"}}
                harness_login_resolved:
                  summary: 登录流程结束
                  value: |
                    data: {"type":"harness_login_resolved","data":{"requestId":"hl_1","result":"succeeded","account":"managed:kimi-code"}}
                heartbeat:
                  summary: 心跳（每30s）
                  value: |
                    data: {"type":"heartbeat"}
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    AcpMessage:
      type: object
      required:
        - id
        - sessionId
        - direction
        - type
        - content
        - createdAt
      properties:
        id:
          type: string
          example: msg_abc123
        sessionId:
          type: string
          example: sess_xyz789
        direction:
          type: string
          enum: [input, output]
        type:
          type: string
          enum: [text, image, tool_call, tool_result, plan, error]
        content:
          type: string
        metadata:
          type: object
          properties:
            toolName:
              type: string
            status:
              type: string
        createdAt:
          type: string
          format: date-time

    SessionStatus:
      type: object
      properties:
        status:
          type: string
          enum: [creating, connecting, idling, running, disconnected, ended]
        error:
          type: string
          description: 错误码，仅在 resume 失败时携带

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
