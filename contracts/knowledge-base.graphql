# 知识库（工作区级，需求 #495）。
#
# 结构：知识库（仅名称 + 权限模式）→ 知识库文档（库内路径唯一 + 标题/标签/描述/Markdown 内容）。
# 存储：`knowledgebases` / `knowledgebasedocuments` / `knowledgebaseevents` 三集合；
# 文档为活动行（删除即释放路径），历史为追加式事件（CREATE/UPDATE/DELETE 全量快照，无 TTL），
# 删除文档不删历史、同路径重建历史延续。
#
# 可见集与权限（服务端唯一判定源 `knowledge-base-access`，与平台 MCP 同口径）：
#   - 可见集 = 本工作区知识库 ∪ 本租户全局工作区知识库（其他普通工作区的库对本工作区成员不可见）；
#   - 权限模式四档：NONE（仅管理员可见/可写）、READ_ONLY（非管理员只读）、
#     UPDATE_ONLY（非管理员可读 + 创建 + 更新，不可删除）、FULL_ACCESS（非管理员 CRUD）；
#   - 管理员（租户 admin）命中任何模式均六项权限全开；`canManage` 恒 = 当前用户是租户管理员；
#   - 全局工作区的库对其他工作区成员可见，且**读写按库自身权限模式判定**（有意偏离
#     「全局工作区 developer 只读」的通用口径）；
#   - 创建知识库需要租户管理员权限（`not a tenant admin`）；默认权限模式：
#     全局工作区 → READ_ONLY，普通工作区 → NONE。
#
# 文档路径：以 `/` 开头，根目录为 `/`，库内唯一；归一化 = trim → 去末尾 `/`（根除外）；
# 拒空路径段、控制字符、NUL；单段 ≤128 字符、全长 ≤512。
# 文档路径可修改（需求 #541）：移动时把该路径**全部历史事件**的 `path` 改写为新路径（历史随文档带入，
# 并追加一条 `MOVE` 事件记录原路径）；新路径历史天然完整，原路径即刻释放、重建后历史从其 `CREATE` 独立起算。
# 权限口径 = `canUpdate`（与更新文档同档，UPDATE_ONLY 模式可用），错误白名单不新增。
#
# 错误口径（白名单，逐字透传；未命中收敛 `internal error`）：
#   `Not authenticated` / `workspace not found` / `knowledge base not found` /
#   `knowledge base name already exists` / `invalid knowledge base name` / `not a tenant admin` /
#   `knowledge base permission denied` / `knowledge base document not found` /
#   `knowledge base document already exists` / `invalid document path` /
#   `invalid document title` / `invalid document tags` / `invalid document description` /
#   `invalid document content`
#
# 不泄露存在性：`knowledgeBaseDocument` 对不可见库/无读权限/文档不存在统一返回 null；
# 写操作对不可见库抛 `knowledge base not found`、对可见但越权抛 `knowledge base permission denied`。
#
# 仓库内建知识库（需求 #545）：
#   - 仓库 `.zag/knowledges/`、`docs/knowledges/` 两个约定目录，以及 `docs/` 的一层文件夹
#     （跳过 `docs/knowledges` 容器目录）下，每个含 `knowledge-base.json`
#     标识文件的子文件夹即一个知识库，库内（含子目录）Markdown 文件为文档；
#   - **只读**：无任何 mutation/写入口，仓库为唯一事实源，平台不落 MongoDB（仅 Redis 短缓存）；
#   - **不进知识库 MCP 工具**：`agent-knowledge-base-tools` 的六个工具与结果均不包含仓库知识库
#     （AI 可直接读会话工作目录中的仓库文件）；知识库 MCP 仅新增 prompts 能力提供编写指引；
#   - 历史即 Git 历史，平台不提供仓库知识库的编辑/删除/历史版本/权限设置；
#   - 懒加载四级只读查询：候选云电脑骨架（纯 DB 读，不触发扫描）→ 单云电脑知识库列表（首次展开触发扫描）
#     → 逐级子条目（展开知识库/目录）→ 单文档内容（点击文档）；
#   - 错误口径：除既有 `Not authenticated` 外，`workspaceId` 不可见/非云电脑默认工作区 →
#     `Workspace not found`；单工作区扫描失败（离线/超时/版本不支持/中继异常）→
#     `repo knowledge base scan failed`（前端节点级失败与重试）；children/document 对任何不可达统一
#     返回 `[]` / `null`（不泄露存在性）。

enum KnowledgeBasePermissionMode {
  NONE
  READ_ONLY
  UPDATE_ONLY
  FULL_ACCESS
}

enum KnowledgeBaseEventOp {
  CREATE
  UPDATE
  DELETE
  # 路径修改：path = 新路径、fromPath = 原路径、快照为移动时点内容（内容不变）
  MOVE
}

type KnowledgeBaseAccess {
  canRead: Boolean!
  canCreate: Boolean!
  canUpdate: Boolean!
  canDelete: Boolean!
  # 重命名/权限模式/删除库（恒 = 当前用户是租户管理员）
  canManage: Boolean!
}

type KnowledgeBase {
  id: ID!
  name: String!
  permissionMode: KnowledgeBasePermissionMode!
  # 归属工作区是否本租户全局工作区（来源徽标）
  global: Boolean!
  myAccess: KnowledgeBaseAccess!
  createdAt: String!
  updatedAt: String!
}

type KnowledgeBaseDocumentMeta {
  path: String!
  title: String!
  tags: [String!]!
  description: String!
  updatedAt: String!
}

type KnowledgeBaseDocument {
  path: String!
  title: String!
  tags: [String!]!
  description: String!
  content: String!
  createdByName: String!
  updatedByName: String!
  createdAt: String!
  updatedAt: String!
}

type KnowledgeBaseTreeItem {
  knowledgeBase: KnowledgeBase!
  # 全库文档元信息（侧边栏树一次拉取，不含 content）
  documents: [KnowledgeBaseDocumentMeta!]!
}

type KnowledgeBaseEvent {
  id: ID!
  path: String!
  op: KnowledgeBaseEventOp!
  # 仅 MOVE 事件有值（原路径）；其余操作恒 null
  fromPath: String
  title: String!
  tags: [String!]!
  description: String!
  # 快照（DELETE 保留删除前最后内容）
  content: String!
  actorName: String!
  createdAt: String!
}

input KnowledgeBaseDocumentInput {
  title: String!
  tags: [String!]!
  description: String!
  content: String!
}

# 仓库知识库来源目录：
#   ZAG = `.zag/knowledges/`，DOCS = `docs/knowledges/`，
#   DOCS_ROOT = `docs/` 的一层文件夹（跳过 `docs/knowledges` 容器目录）
enum RepoKnowledgeBaseSource {
  ZAG
  DOCS
  DOCS_ROOT
}

# 候选云电脑骨架（纯 DB 读，不触发仓库扫描）
type RepoKnowledgeBaseHost {
  cloudHostId: ID!
  cloudHostName: String!
  workspaceId: ID!
  # 工作组件版本是否支持扫描（false 时前端展示升级提示，不发起加载）
  scanSupported: Boolean!
}

type RepoKnowledgeBase {
  # repo:<workspaceId>:<source>:<encodeURIComponent(folder)>
  id: ID!
  # schema.name（不合法时为空串，看 valid/errors）
  name: String!
  description: String!
  source: RepoKnowledgeBaseSource!
  folder: String!
  workspaceId: ID!
  cloudHostId: ID!
  cloudHostName: String!
  valid: Boolean!
  errors: [String!]!
  # 合法库的可用文档数（不含 error 文档；不合法库为 0）
  documentCount: Int!
  # 该库是否因单文件夹直接子项超 1000 截断
  truncated: Boolean!
}

enum RepoKnowledgeBaseNodeKind {
  FOLDER
  DOCUMENT
}

# 知识库内某一目录的直接子条目（懒加载逐级展开）
type RepoKnowledgeBaseNode {
  kind: RepoKnowledgeBaseNodeKind!
  # 文件夹=目录段名；文档=展示标题
  name: String!
  # 归一路径（/ 开头；文档用于打开预览）
  path: String!
  # 文档级不可用原因（白名单文案，如 file too large）；非空时该文档不可打开
  error: String
}

type RepoKnowledgeBaseDocument {
  path: String!
  title: String!
  # 原文全文（含文首 front matter 块，不剥离）；前端将其渲染为键值表格
  content: String!
}

extend type Query {
  # 可见知识库列表（本工作区 ∪ 本租户全局工作区，按权限模式过滤）
  knowledgeBases: [KnowledgeBase!]!
  # 侧边栏树：可见知识库 + 各自文档元信息
  knowledgeBaseTree: [KnowledgeBaseTreeItem!]!
  # 某路径前缀下的文档元信息（prefix 缺省 = 全库）
  knowledgeBaseDocuments(knowledgeBaseId: ID!, prefix: String): [KnowledgeBaseDocumentMeta!]!
  # 单文档完整内容；不可见/无读权限/不存在统一 null
  knowledgeBaseDocument(knowledgeBaseId: ID!, path: String!): KnowledgeBaseDocument
  # 历史：path 缺省 = 全库历史；恒 createdAt 倒序；limit 缺省 50 上限 200；before 为 createdAt ISO 游标
  knowledgeBaseEvents(knowledgeBaseId: ID!, path: String, limit: Int, before: String): [KnowledgeBaseEvent!]!

  # 候选云电脑骨架：当前用户可见、RUNNING 且已有默认工作区的云电脑（纯 DB 读，不触发扫描）
  repoKnowledgeBaseHosts: [RepoKnowledgeBaseHost!]!
  # 某云电脑默认工作区的仓库知识库列表；首次展开触发扫描；refresh=true 重新检测
  repoKnowledgeBases(workspaceId: ID!, refresh: Boolean): [RepoKnowledgeBase!]!
  # 某知识库内某目录的直接子条目（path 缺省 = 根层级）
  repoKnowledgeBaseDocumentChildren(id: ID!, path: String): [RepoKnowledgeBaseNode!]!
  # 单文档完整内容（含 front matter 原文）；不可达/不存在统一 null（不泄露存在性）
  repoKnowledgeBaseDocument(id: ID!, path: String!): RepoKnowledgeBaseDocument
}

extend type Mutation {
  createKnowledgeBase(name: String!): KnowledgeBase!
  renameKnowledgeBase(id: ID!, name: String!): KnowledgeBase!
  updateKnowledgeBasePermission(id: ID!, permissionMode: KnowledgeBasePermissionMode!): KnowledgeBase!
  deleteKnowledgeBase(id: ID!): Boolean!
  # path：文档路径（以 / 开头，库内唯一；由服务端归一化，非法 → invalid document path）
  createKnowledgeBaseDocument(knowledgeBaseId: ID!, path: String!, input: KnowledgeBaseDocumentInput!): KnowledgeBaseDocument!
  # newPath 可选：提供且归一化后与 path 不同 → 一次保存原子完成「移动 + 更新」（历史随文档带入新路径，
  # 并追加 MOVE 事件）；目标路径占用 → `knowledge base document already exists`；
  # newPath 与 path 归一后相同（含 null/缺省）→ 视为未提供（仅内容更新，不产生 MOVE 事件）。
  # 权限 = canUpdate；路径非法 → `invalid document path`；源不存在 → `knowledge base document not found`。
  updateKnowledgeBaseDocument(knowledgeBaseId: ID!, path: String!, input: KnowledgeBaseDocumentInput!, newPath: String): KnowledgeBaseDocument!
  deleteKnowledgeBaseDocument(knowledgeBaseId: ID!, path: String!): Boolean!
}
