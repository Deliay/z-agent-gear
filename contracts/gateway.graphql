type Gateway {
  id: ID!
  controllerId: ID!
  name: String!
  port: Int!
  status: String!
  createdAt: String!
  # 对外访问地址（派生只读，不落库）：服务端单一来源由 PUBLIC_BASE_URL 派生，恒含尾斜杠，
  # 形如 `https://host/api/gateway/{controllerId}/{name}/`；与平台 MCP agent-gateway-tools
  # 返回的 endpoint、前端展示地址逐字一致。
  endpoint: String!
}

type GatewayList {
  gateways: [Gateway!]!
  total: Int!
  limit: Int!
}

type Query {
  gateways(controllerId: ID!): GatewayList!
}

type Mutation {
  createGateway(controllerId: ID!, name: String!, port: Int!): Gateway!
  deleteGateway(controllerId: ID!, name: String!): Boolean!
}
