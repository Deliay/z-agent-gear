# 前台认证契约（三层帐号体系）
#
# 前台注册已硬关闭：契约层不再提供 signup，开户仅由后台经 agent-api
# `POST /internal/users` 发起（见 contracts/admin-tenant.graphql）。
#
# 模型口径：
# - 账户（accounts）承载登录凭据（username/passwordHash），不引用用户；
# - 用户（users）为身份主体，经 accountId 关联账户（account→users 一对多）、
#   经 tenantId 关联租户（tenant→users 一对多）；
# - 租户（tenants）本期仅 personal（个人专属，单成员、不可删除、不可加成员）。

enum TenantType {
  personal
  team
}

type Tenant {
  id: ID!
  name: String!
  type: TenantType! # personal | team（一期仅 personal）
  memberCount: Int! # 租户成员数（tenant→users 一对多；一期 personal 恒为 1）
}

type User {
  id: ID!
  name: String! # 展示名（迁移后=原用户名）
  tenant: Tenant! # 当前用户归属租户（一期恒为个人专属租户）
  createdAt: String!
}

type AuthPayload {
  token: String!
  user: User!
}

# ===== 第三方登录（自定义 OIDC / GitHub OAuth）=====
#
# 配置唯一写方在 admin-api（contracts/admin-auth-provider.graphql）；本契约仅暴露
# 前台登录页所需的免登录入口信息与一次性票据兑换，值域与 admin 侧逐字一致。

# 第三方登录类型（三个契约文件各自自足，值域由 schema 契约测试断言）
enum AuthProviderType {
  oidc
  github_oauth
}

# 第三方登录入口信息（免登录查询，仅返回 enabled 且 enableFrontLogin=true 的配置）
type AuthProviderInfo {
  id: ID!
  type: AuthProviderType!
  displayName: String! # 按钮文案「使用 {displayName} 登录」；github_oauth 恒为 GitHub
}

type Query {
  me: User
  # 免登录；无配置时返回 []
  authProviders: [AuthProviderInfo!]!
}

type Mutation {
  login(username: String!, password: String!): AuthPayload!
  # 一次性登录票据兑换（OAuth 回调后前端凭 ticket 换 AuthPayload）；
  # ticket 由 agent-api 回写 Redis（TTL 60s，GETDEL 一次性消费）。
  # 失败：BAD_USER_INPUT('invalid or expired ticket')
  exchangeLoginTicket(ticket: String!): AuthPayload!
}
