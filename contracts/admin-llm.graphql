# 全局供应商与模型契约（云控制器管理后台一期）
#
# 鉴权要求：所有 Query/Mutation 需要 `Authorization: Bearer <admin JWT>`；
# 未认证返回 `UNAUTHENTICATED`（错误信息 `Not authenticated`）。
#
# 本契约复用 `llm.graphql` 的 Provider/Model/ProviderInput/CustomModelInput/
# ProviderBatchPayload 语义，差异是所有操作作用于 `scope = 'global'` 的数据：
#   - 保存供应商前先调供应商 API 校验连通性（失败不保存）
#   - 凭据 AES-256-GCM 加密存储、脱敏返回：长度 > 8 时为「前 3 后 4」，
#     长度 ≤ 8 时整体掩码为 `****`（避免短凭据被拼出近似完整值）
#   - 创建/更新供应商**不再自动导入或重同步模型**：创建后模型列表为空，由管理员通过
#     `listGlobalProviderModels` 拉取上游清单、`importGlobalModels` 手动勾选导入；
#     更新供应商时仅做连通性校验，不写任何模型
#   - 删除供应商级联删除其全部模型（含自定义模型）；禁用供应商级联禁用其模型
#   - `scope = 'global'` 内 `Model.name` **全局唯一（跨供应商）**：
#     `createGlobalCustomModel` / `importGlobalModels` 冲突时返回
#     `Model name already exists: <names>`；历史重名由迁移 005 一次性改名并写入
#     `model_rename_records`（`modelRenameRecords` 只读查询）
#   - `deleteGlobalModel` 可删除任意全局模型（导入模型与自定义模型），删除后前台不再展示
#   - `name` 在同 scope 内唯一

enum ProviderType {
  OpenAI
  Anthropic
}

enum CredentialType {
  api_key
}

enum ConfigScope {
  user
  global
}

type Provider {
  id: ID!
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType!
  credentialValue: String!
  isEnabled: Boolean!
  scope: ConfigScope!
  models: [Model!]!
  createdAt: String!
  updatedAt: String!
}

type Model {
  id: ID!
  providerId: ID!
  # provider 可为空：providerId 悬空（关联供应商已不存在）时返回 null，
  # 避免非空违规导致整条 adminModels 查询失败（与 llm.graphql 的 Model.provider 对齐）。
  provider: Provider
  name: String!
  isCustom: Boolean!
  isEnabled: Boolean!
  sortOrder: Int!
  scope: ConfigScope!
  # 费用中心模型定价（便捷编辑视图）；价目真相在 productprices。
  # 与 llm.graphql 的 ModelPricing 逐字一致（双侧 schema 同步演进）。
  pricing: ModelPricing
  createdAt: String!
  updatedAt: String!
}

# credits / 百万 token（边界以 credits 展示，持久层为整数分）
type ModelPricing {
  inputPerMillion: Float!
  cachedInputPerMillion: Float!
  outputPerMillion: Float!
  isBillable: Boolean!
}

input ModelPricingInput {
  inputPerMillion: Float!
  cachedInputPerMillion: Float!
  outputPerMillion: Float!
  isBillable: Boolean! = true
}

input ProviderInput {
  name: String!
  type: ProviderType!
  endpoint: String!
  credentialType: CredentialType! = api_key
  credentialValue: String!
}

input CustomModelInput {
  providerId: ID!
  name: String!
}

type ProviderBatchPayload {
  successCount: Int!
}

# 上游模型清单条目（导入弹窗数据源）
type ProviderModelOption {
  name: String! # 上游模型名（已 trim/去重，保持上游顺序）
  isImported: Boolean! # 该供应商下已存在（(providerId, name) 命中）
  isDuplicate: Boolean! # 已被其他供应商的 global 模型占用（全局唯一冲突）
}

# 历史重名整理台账（迁移 005 写入，只读；不随模型删除而删除）
type ModelRenameRecord {
  id: ID!
  modelId: ID! # 被改名的模型（现以 newName 存在）
  providerId: ID!
  providerName: String! # 冗余留档：供应商删除后仍可读
  oldName: String!
  newName: String!
  batchId: String!
  renamedAt: String! # ISO 8601
}

type Query {
  adminProviders: [Provider!]! # 仅 scope=global
  adminModels: [Model!]! # 仅 scope=global
  adminModelsByProvider(providerId: ID!): [Model!]!
  # 拉取指定供应商的上游模型清单（连通性失败返回「供应商连通性测试失败…」）
  listGlobalProviderModels(providerId: ID!): [ProviderModelOption!]!
  # 历史重名整理记录（renamedAt desc）；空环境返回 []
  modelRenameRecords: [ModelRenameRecord!]!
}

type Mutation {
  createGlobalProvider(input: ProviderInput!): Provider!
  updateGlobalProvider(id: ID!, input: ProviderInput!): Provider!
  deleteGlobalProvider(id: ID!): Boolean!
  toggleGlobalProvider(id: ID!): Provider!
  batchEnableGlobalProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDisableGlobalProviders(ids: [ID!]!): ProviderBatchPayload!
  batchDeleteGlobalProviders(ids: [ID!]!): ProviderBatchPayload!
  createGlobalCustomModel(input: CustomModelInput!): Model!
  # 手动导入上游模型（幂等：已存在项跳过）；返回实际新建的模型
  importGlobalModels(providerId: ID!, names: [String!]!): [Model!]!
  # 删除任意全局模型（导入模型或自定义模型）
  deleteGlobalModel(id: ID!): Model!
  toggleGlobalModel(id: ID!): Model!
  updateGlobalModelSortOrder(ids: [ID!]!): [Model!]!
}
