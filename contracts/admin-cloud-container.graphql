# 云端容器契约（云Agent二期）
#
# 鉴权要求：所有 Query/Mutation 需要 `Authorization: Bearer <admin JWT>`；
# 未认证返回 `UNAUTHENTICATED`（错误信息 `Not authenticated`）。
# 该域数据由 cloud-controller 持有（单一事实源），admin-api 经内部 HTTP API 代理取数。
#
# 说明：
# - 状态语义见 contracts/cloud-controller-websocket.md 附录 A.4。
# - 本期 `adminStartCloudContainer` 仅接受 `IDLE`；其余用途服务端返回明确错误文案「该任务类型暂未开放」。
# - 控制面（cloud-controller）不可达时：列表降级只读落库状态；同一次查询内
#   `adminCloudContainerControlPlane.online` 为 false 并携带「控制面离线」提示（与列表降级事件同源硬耦合）；
#   写操作不降级。
# - 工作负载字段（`workloads` / `currentWorkloadName` / 启动参数 `workloadIds`）的完整语义见
#   contracts/admin-cloud-workload.graphql 与 contracts/cloud-controller-websocket.md §2.9/§2.10。

type CloudContainer {
  id: ID!
  name: String!                # K8s Job 名
  status: CloudContainerStatus!
  purpose: CloudContainerPurpose!
  refId: String                # 关联对象 ID（idle 为 null）
  createdAt: String!
  connectedAt: String          # 回连上线时间
  exitedAt: String             # 退出时间
  exitReason: String           # 退出/失败原因
  # 容器启动时挂载的工作负载，按选择顺序返回；已删除的工作负载会被省略（不返回空占位）
  workloads: [CloudWorkload!]!
  # 初始化中（INITIALIZING）当前正在执行的工作负载脚本名称；非初始化中为 null
  currentWorkloadName: String
  # 计费账户 ID（创建时指定；缺省为当前管理员账户）；未指定/存量容器为 null（不计费）
  billingAccountId: ID
  # 就绪计费起点（首次进入 ONLINE 的时刻）；null=未就绪/不计费
  billingStartedAt: String
}

# 控制面健康标记（降级提示的承载字段）：online=false 时前端展示「控制面离线」横幅。
type CloudContainerControlPlane {
  online: Boolean!
  message: String
}

enum CloudContainerStatus {
  CREATING
  CONNECTING
  INITIALIZING   # 回连后正在按序执行挂载工作负载的初始化脚本
  ONLINE
  EXITED
  DESTROYING
  FAILED
}

enum CloudContainerPurpose {
  IDLE
  ADMIN_TASK
  WORKFLOW
  SESSION
}

type Query {
  # 控制面不可达时降级为落库只读数据（data 照常返回）
  adminCloudContainers: [CloudContainer!]!
  # 控制面健康标记；与 adminCloudContainers 同一次轮询一起查询
  adminCloudContainerControlPlane: CloudContainerControlPlane!
}

type Mutation {
  # 启动一个工作容器；本期 purpose 仅支持 IDLE。
  # workloadIds 与 workloads 二选一，同时非空返回错误
  # `workloadIds and workloads cannot both be provided`：
  # - workloadIds（兼容旧调用）：缺省或空数组行为与现状完全一致（不挂载工作负载，回连后直接 ONLINE）；
  #   传入时按数组顺序挂载，去重保序，等价于所有工作负载使用默认参数；服务端校验存在/数组长度
  #   （去重前）≤10，非法返回错误（内部 API 400 INVALID_WORKLOAD）。
  # - workloads（新调用）：每项携带 `params`（缺省字段使用默认值）与可选的 `required`
  #   （本次启动是否将该项标记为「必须」）；服务端展开隐式依赖、去重、
  #   按拓扑序排序并归一参数后下发；展开后超过 10 个返回 `expanded workloads exceed 10`；
  #   重复 `workloadId` 返回 `duplicate workload selection`；依赖不存在返回 `dependency workload not found`。
  #   `required` 语义：缺省 false；仅 `=== true`（显式选择）生效且仅作用于初始化阶段，
  #   隐式依赖永远按 false 处理；被标记为「必须」的工作负载初始化失败/超时/执行前被删除时，
  #   服务端会中断剩余初始化并强制注销容器（不重试、不退避），详见 contracts/cloud-controller-websocket.md §2.9。
  # - workloadIds（兼容旧调用）等价于全部 `required=false`。
  # billingAccountId（可选）：容器计费归属账户；缺省为当前管理员账户（get-or-create）。
  adminStartCloudContainer(
    purpose: CloudContainerPurpose!
    workloadIds: [ID!]
    workloads: [CloudWorkloadSelectionInput!]
    billingAccountId: ID
  ): CloudContainer!
  # 强制销毁容器（幂等：终态容器重复调用返回 true）。
  # 注意：在线容器需下发 shutdown 并等待宽限期（无清理脚本约 10s；有清理脚本时还需先执行 post 批次，
  # 默认预算 90s + 10s 宽限）后才完成，调用方应使用大于宽限期的超时（默认 180s）。
  adminDestroyCloudContainer(id: ID!): Boolean!
}
