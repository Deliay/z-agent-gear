type PortForward {
  id: ID!
  controllerId: ID!
  port: Int!
  status: String!
  createdAt: String!
}

type PortForwardList {
  portForwards: [PortForward!]!
  total: Int!
  limit: Int!
}

type Query {
  portForwards(controllerId: ID!): PortForwardList!
}

type Mutation {
  createPortForward(controllerId: ID!, port: Int!): PortForward!
  deletePortForward(controllerId: ID!, port: Int!): Boolean!
}
