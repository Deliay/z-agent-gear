openapi: 3.1.0
info:
  title: Port Forward Proxy API
  description: 端口转发代理接口，将外部请求代理到 agent-controller 所在机器的本地服务端口。需要身份验证。
  version: 1.0.0

servers:
  - url: /api
    description: agent-api

paths:
  /forward/{controllerId}/{port}/{path}:
    get:
      operationId: proxyPortForward
      summary: 代理请求到本地服务
      description: |
        将外部 HTTP 请求代理到 agent-controller 所在机器上的本地服务端口。
        
        请求链路：外部用户 → agent-api → Redis Pub/Sub → controller-api → Socket.IO → agent-controller → localhost:{port}
        
        要求：
        - 需要 Bearer token 身份验证
        - 对应的端口转发记录必须存在且状态为 active
      tags:
        - Port Forward Proxy
      parameters:
        - name: controllerId
          in: path
          required: true
          description: Controller ID
          schema:
            type: string
        - name: port
          in: path
          required: true
          description: 目标本地端口号
          schema:
            type: integer
            minimum: 1
            maximum: 65535
        - name: path
          in: path
          required: true
          description: 代理路径（本地服务的子路径）
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 本地服务的响应（透传状态码、Headers、Body）
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 端口转发不存在或未激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 代理失败（本地服务不可达或响应异常）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
