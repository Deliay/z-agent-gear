name: Build controller-api Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'servers/controller-api/**'

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: zero-tools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: servers/controller-api/pnpm-lock.yaml

      # 测试门禁：构建前跑单测，避免带红测试推成 latest
      - name: Install and test
        working-directory: servers/controller-api
        run: pnpm install --frozen-lockfile && pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/controller-api
          file: servers/controller-api/Dockerfile
          load: true
          push: true
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/controller-api:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/controller-api:latest
          provenance: false
          sbom: false

      # 单项目依赖隔离断言：镜像内只允许存在当前项目依赖
      - name: Assert single-project dependencies
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/controller-api:${{ github.sha }}"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            cd /app &&
            test ! -d servers &&
            test ! -d apps &&
            test ! -d packages &&
            pnpm list --depth 0 --prod
          '
