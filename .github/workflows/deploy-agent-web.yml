name: Deploy agent-web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'apps/agent-web/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/agent-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/agent-web

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
        working-directory: apps/agent-web
        env:
          VITE_CONTROLLER_API_URL: https://zag-ctrl-api.fffdan.com
          VITE_BASE_URL: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/agent-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
