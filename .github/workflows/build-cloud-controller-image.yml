name: Build cloud-controller Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'servers/cloud-controller/**'

permissions:
  contents: read

env:
  # 统一镜像命名空间：全部服务使用同一仓库路径，且与 deploy/k8s/cloud-controller.yaml 引用一致。
  IMAGE_NAMESPACE: zero-tools
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: servers/cloud-controller/pnpm-lock.yaml

      - name: Install
        working-directory: servers/cloud-controller
        run: pnpm install --frozen-lockfile

      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongoms-${{ runner.os }}-${{ hashFiles('servers/cloud-controller/pnpm-lock.yaml') }}

      # allowBuilds 显式禁止 mongodb-memory-server 的 install 脚本，这里直接执行脚本预先下载 mongod
      - name: Pre-download mongod
        working-directory: servers/cloud-controller
        run: node node_modules/mongodb-memory-server/postinstall.js

      # 测试门禁：构建前跑单测，避免带红测试推成 latest
      - name: Test
        working-directory: servers/cloud-controller
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/cloud-controller
          file: servers/cloud-controller/Dockerfile
          load: true
          push: true
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:latest
          provenance: false
          sbom: false

      # 单项目依赖隔离断言：镜像内只允许存在当前项目依赖
      - name: Assert single-project dependencies
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:${{ github.sha }}"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            cd /app &&
            test ! -d servers &&
            test ! -d apps &&
            test ! -d packages &&
            pnpm list --depth 0 --prod
          '

      # 镜像启动冒烟：拉起 Mongo，启动容器并验证 /health 可响应（防止打包入口不可用导致 CrashLoop）
      - name: Smoke test image
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:${{ github.sha }}"
          docker run -d --name smoke-mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            docker exec smoke-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name smoke-cc --network host \
            -e MONGODB_URI=mongodb://localhost:27017/agent-gear \
            -e INTERNAL_API_TOKEN=smoke-test-internal-token-0123456789 \
            -e K8S_NAMESPACE=zag-cloud \
            -e WORKER_IMAGE=example.invalid/zag/worker:smoke \
            -e PUBLIC_WS_ENDPOINT=localhost:8003 \
            -e K8S_ENABLED=false \
            -e PORT=8003 \
            "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8003/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke-cc || true
          if [ "$ok" != "1" ]; then echo "smoke test failed: /health not reachable"; exit 1; fi
