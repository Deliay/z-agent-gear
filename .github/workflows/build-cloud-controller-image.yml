name: Build cloud-controller Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'servers/cloud-controller/**'

permissions:
  contents: read

env:
  # 统一镜像命名空间：必须与 deploy/k8s/cloud-controller.yaml 引用的仓库路径一致，
  # 避免 CI 推送与部署引用两套路径需要人工搬运。
  IMAGE_NAMESPACE: zag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: servers/cloud-controller/package-lock.json

      # 测试门禁：构建前跑单测，避免带红测试推成 latest
      - name: Install and test
        working-directory: servers/cloud-controller
        run: npm ci && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/cloud-controller
          file: servers/cloud-controller/Dockerfile
          load: true
          push: true
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:latest
          provenance: false
          sbom: false

      # 镜像启动冒烟：拉起 Mongo，启动容器并验证 /health 可响应（防止打包入口不可用导致 CrashLoop）
      - name: Smoke test image
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/cloud-controller:${{ github.sha }}"
          docker run -d --name smoke-mongo -p 27017:27017 mongo:7
          for i in $(seq 1 30); do
            docker exec smoke-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name smoke-cc --network host \
            -e MONGODB_URI=mongodb://localhost:27017/agent-gear \
            -e INTERNAL_API_TOKEN=smoke-test-internal-token \
            -e K8S_NAMESPACE=zag-cloud \
            -e WORKER_IMAGE=example.invalid/zag/worker:smoke \
            -e PUBLIC_WS_ENDPOINT=localhost:8003 \
            -e K8S_ENABLED=false \
            -e PORT=8003 \
            "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8003/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke-cc || true
          if [ "$ok" != "1" ]; then echo "smoke test failed: /health not reachable"; exit 1; fi
