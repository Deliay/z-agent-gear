name: Build agent-api Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'servers/agent-api/**'

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: zero-tools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: servers/agent-api/package-lock.json

      # 测试门禁：构建前跑单测，避免带红测试推成 latest
      - name: Install and test
        working-directory: servers/agent-api
        run: npm ci && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: servers/agent-api
          file: servers/agent-api/Dockerfile
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/agent-api:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/agent-api:latest
          push: true
          provenance: false
          sbom: false
