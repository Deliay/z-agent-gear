name: Publish agent-gear to npm

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'packages/agent-controller/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # 仓库根 .npmrc 指向镜像源；发布必须显式锁定 npmjs.org
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/agent-controller

      - name: Build
        run: pnpm run build
        working-directory: packages/agent-controller

      - name: Test
        run: pnpm test
        working-directory: packages/agent-controller

      # 版本幂等：同一版本已发布时跳过，避免 release 分支重复推送导致 workflow 失败
      - name: Check published version
        id: version
        working-directory: packages/agent-controller
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "agent-gear@$VERSION" version >/dev/null 2>&1; then
            echo "agent-gear@$VERSION already published; skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        working-directory: packages/agent-controller
        run: pnpm publish --access public --no-git-checks --provenance
