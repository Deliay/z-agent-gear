name: Build worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'deploy/images/worker/**'

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: zero-tools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/images/worker
          file: deploy/images/worker/Dockerfile
          load: true
          push: true
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:latest
          provenance: false
          sbom: false

      # 镜像自验：主目录工具链由 entrypoint 运行时安装，镜像层不应预装。
      # 真实自举依赖内网 git / Nexus，公网 CI 只做静态核对；运行期验收见 BUILD.md。
      - name: Verify image
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:${{ github.sha }}"
          docker run --rm --entrypoint bash "$IMAGE" -c '
            set -e
            id worker
            for c in node npm pnpm agent-gear nvm; do
              if command -v "$c" >/dev/null 2>&1; then
                echo "$c unexpectedly preinstalled"; exit 1
              fi
            done
            [ ! -e /etc/profile.d/nvm.sh ]
            git --version
            gh --version
            grep -q "bootstrap_home" /usr/local/bin/entrypoint.sh
            echo "image static verification passed"
          '
