name: Build worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'deploy/images/worker/**'

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: zero-tools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/images/worker
          file: deploy/images/worker/Dockerfile
          load: true
          push: true
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:latest
          provenance: false
          sbom: false

      # 镜像自验：root 环境无 nodejs，统一通过 worker 用户并显式构造 PATH
      - name: Verify image
        run: |
          set -e
          IMAGE="${{ secrets.DOCKER_ENDPOINT }}/${{ env.IMAGE_NAMESPACE }}/worker:${{ github.sha }}"
          docker run --rm --entrypoint bash "$IMAGE" -c '
            sudo -u worker env HOME=/home/worker \
              PATH="/home/worker/.nvm/current/bin:/home/worker/.local/share/pnpm/bin:/home/worker/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              bash -c "
                node -v &&
                npm -v &&
                pnpm -v &&
                agent-gear --version &&
                agent-gear harness --help >/dev/null &&
                ! command -v claude-agent-acp &&
                ! command -v codex-acp
              "
          '
