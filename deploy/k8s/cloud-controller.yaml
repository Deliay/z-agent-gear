# cloud-controller K8s 部署示例（云Agent二期）
#
# 前置条件：
#   1. 集群节点已预装 sysbox（runtimeClass `sysbox-runc`），否则工作容器 Pod 无法调度；
#      未启用时可删除 Deployment 的 RUNTIME_CLASS_NAME 或改为可用 runtime。
#   2. 内网 Harbor 可拉取 cloud-controller 镜像；内网 Nexus/Harbor mirror 可达。
#   3. 已创建命名空间（下例为 zag-cloud）与 Secret（INTERNAL_API_TOKEN / MONGODB_URI）。
#   4. RBAC 收敛：cloud-controller 仅对本命名空间的 Job 具备 get/list/watch/create/delete。
#
# 应用：kubectl apply -f deploy/k8s/cloud-controller.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-controller
  namespace: zag-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-controller-jobs
  namespace: zag-cloud
rules:
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'watch', 'create', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-controller-jobs
  namespace: zag-cloud
subjects:
  - kind: ServiceAccount
    name: cloud-controller
    namespace: zag-cloud
roleRef:
  kind: Role
  name: cloud-controller-jobs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-controller-secrets
  namespace: zag-cloud
type: Opaque
stringData:
  # 与 admin-api 共享；生产请替换为强随机值
  INTERNAL_API_TOKEN: 'change-me-internal-token'
  MONGODB_URI: 'mongodb://mongodb:27017/agent-gear'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-controller
  namespace: zag-cloud
  labels:
    app: cloud-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-controller
  template:
    metadata:
      labels:
        app: cloud-controller
    spec:
      serviceAccountName: cloud-controller
      containers:
        - name: cloud-controller
          image: core.harbor.internal.fffdan.com/zag/cloud-controller:latest
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: '8003'
            - name: K8S_ENABLED
              value: 'true'
            - name: K8S_NAMESPACE
              value: 'zag-cloud'
            - name: WORKER_IMAGE
              value: 'core.harbor.internal.fffdan.com/zag/worker:latest'
            - name: PUBLIC_WS_ENDPOINT
              value: 'cloud-controller.example.internal'
            - name: RUNTIME_CLASS_NAME
              value: 'sysbox-runc'
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cloud-controller-secrets
                  key: MONGODB_URI
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloud-controller-secrets
                  key: INTERNAL_API_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-controller
  namespace: zag-cloud
spec:
  selector:
    app: cloud-controller
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
# 对外暴露 wss（Socket.IO /worker 与内部 REST 复用同一端口；内部 REST 建议仅集群内可达，
# 如需同时对外暴露请将 /internal 路径单独限制来源）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-controller
  namespace: zag-cloud
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: cloud-controller
spec:
  ingressClassName: nginx
  rules:
    - host: cloud-controller.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-controller
                port:
                  number: 8003
